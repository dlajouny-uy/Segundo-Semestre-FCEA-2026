<title>Mi semestre 🎀 · Planificación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7FB; --bg2:#F3EEFF;
  --card:#FFFFFF; --card2:#FFF2F8;
  --ink:#4B3A55; --soft:#8E7C9B;
  --rosa:#FF8FB8; --lav:#B196EE; --menta:#6FD3B7;
  --line:#F1E4F3;
  --shadow:0 6px 20px rgba(178,138,200,.14);
  --r:20px;
}
[data-theme="night"]{
  --bg:#241B33; --bg2:#1A1427;
  --card:#2F2442; --card2:#382B4E;
  --ink:#F4E9FB; --soft:#B7A5CB;
  --line:#453660;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Quicksand',system-ui,sans-serif;
  background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-size:15.5px;line-height:1.5;
  padding-bottom:88px;
  transition:background .3s,color .3s;
}
h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;color:inherit}

/* ---------- estructura ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{
  display:flex;align-items:center;gap:12px;
  padding:max(20px,env(safe-area-inset-top)) 0 12px;
}
.brand h1{font-size:19px;display:flex;align-items:center;gap:9px}
.mono{width:30px;height:30px;border-radius:9px;flex:none}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--soft);font-weight:600}
.spacer{flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:14px;background:var(--card);
  box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;
  transition:transform .15s;
}
.icon-btn:active{transform:scale(.92)}

/* tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
nav.tabs button{
  flex:1;border-radius:16px;padding:7px 4px;font-size:10.5px;font-weight:700;
  color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background .2s,color .2s;
}
nav.tabs button i{font-style:normal;font-size:19px;line-height:1}
nav.tabs button.on{background:var(--card2);color:var(--rosa)}

/* ---------- tarjetas ---------- */
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;
}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.muted{color:var(--soft)}

/* ---------- HOY: el bloque de ahora ---------- */
.now{
  background:linear-gradient(135deg,var(--rosa),var(--lav));
  color:#fff;border-radius:26px;padding:20px 18px;margin-bottom:16px;
  box-shadow:0 10px 26px rgba(200,140,190,.32);position:relative;overflow:hidden;
}
.now::after{
  content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
  border-radius:50%;background:rgba(255,255,255,.14);
}
.now .eyebrow{color:rgba(255,255,255,.82)}
.now h2{font-size:24px;margin:6px 0 2px;position:relative}
.now p{margin:0;font-size:13.5px;opacity:.92;position:relative}
.now .barra{height:6px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:14px;overflow:hidden;position:relative}
.now .barra i{display:block;height:100%;background:#fff;border-radius:99px}

/* ---------- el riel del día ---------- */
.dia-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.dia-head h3{font-size:16.5px}
.dia-head .pill{
  margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;
  background:var(--card2);color:var(--soft)
}
.dia-head .pill.full{background:var(--menta);color:#134438}
.foco{font-size:12.5px;color:var(--soft);font-weight:600;margin:0 0 12px}
.foco b{color:var(--ink)}

.riel{position:relative;padding-left:52px}
.riel .hueco{
  position:relative;height:22px;
  display:flex;align-items:center;font-size:10.5px;color:var(--soft);font-weight:600;
}
.riel .hueco::before{
  content:"";position:absolute;left:-30px;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 9px);
}
.bloque{
  position:relative;border-radius:16px;padding:11px 13px;margin-bottom:8px;
  background:var(--card2);display:flex;gap:10px;align-items:flex-start;
  border-left:4px solid var(--line);transition:opacity .2s,transform .12s;
  text-align:left;width:100%;
}
.bloque:active{transform:scale(.985)}
.bloque .hora{
  position:absolute;left:-52px;top:12px;width:44px;text-align:right;
  font-size:11.5px;font-weight:700;color:var(--soft);line-height:1.25;
}
.bloque .hora small{display:block;font-size:9.5px;font-weight:600;opacity:.7}
.bloque .tick{
  flex:none;width:22px;height:22px;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:transparent;margin-top:1px;
  transition:background .2s,border-color .2s;
}
.bloque .tx{flex:1;min-width:0}
.bloque .tx b{display:block;font-size:14px;font-weight:700}
.bloque .tx span{display:block;font-size:12.5px;color:var(--soft);font-weight:600}
.bloque.done{opacity:.55}
.bloque.done .tick{background:var(--menta);border-color:var(--menta);color:#fff}
.bloque.done .tx b{text-decoration:line-through}
.bloque.ahora{box-shadow:0 0 0 2.5px var(--rosa);background:var(--card)}
.bloque .flag{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;background:var(--rosa);color:#fff;align-self:center;
}

/* ---------- metas flexibles (finde) ---------- */
.meta{border-radius:18px;padding:14px;background:var(--card2);margin-bottom:10px;border-left:4px solid var(--line)}
.meta .mtop{display:flex;align-items:center;gap:8px}
.meta .mtop b{font-size:14.5px}
.meta .mtop .val{margin-left:auto;font-size:13px;font-weight:700}
.meta ul{margin:9px 0 0;padding-left:17px;font-size:12.5px;color:var(--soft);font-weight:600}
.meta ul li{margin:2px 0}
.bar{height:9px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.plusminus{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.plusminus button{
  border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:700;
  background:var(--card);box-shadow:var(--shadow);transition:transform .12s
}
.plusminus button:active{transform:scale(.93)}
.mini-check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:5px 0;width:100%;text-align:left}
.mini-check .tick{flex:none;width:19px;height:19px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.mini-check.done .tick{background:var(--menta);border-color:var(--menta);color:#fff}
.mini-check.done span{text-decoration:line-through;opacity:.6}

/* ---------- grilla semana ---------- */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){ .grid{grid-template-columns:1fr 1fr} }
@media(min-width:1020px){ .grid{grid-template-columns:1fr 1fr 1fr} }

/* ---------- materias ---------- */
.mat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank{
  flex:none;width:30px;height:30px;border-radius:11px;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:var(--card2)
}
.mat-head h3{font-size:16px;flex:1;min-width:0}
.mat-head .hrs{font-size:11.5px;font-weight:700;color:var(--soft);text-align:right;line-height:1.3}
.fecha-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:10px;flex-wrap:wrap}
.fecha-row input{
  border:2px solid var(--line);background:var(--card2);border-radius:11px;
  padding:5px 9px;font-size:12.5px;font-weight:700;
}
.cuenta{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2)}
.cuenta.bien{background:#6FD3B733;color:var(--menta)}
.cuenta.ojo{background:#FFB74D33;color:#E08A1E}
.cuenta.mal{background:#FF8FB833;color:var(--rosa)}
.uni{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line)}
.uni:last-of-type{border-bottom:none}
.uni .tick{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.uni.done .tick{background:var(--lav);border-color:var(--lav);color:#fff}
.uni .nm{flex:1;font-size:13px;font-weight:600;text-align:left;min-width:0}
.uni.done .nm{text-decoration:line-through;opacity:.55}
.uni .del{font-size:15px;color:var(--soft);opacity:.5;padding:0 3px}
.add-row{display:flex;gap:7px;margin-top:10px}
.add-row input{
  flex:1;min-width:0;border:2px solid var(--line);background:var(--card2);
  border-radius:12px;padding:8px 11px;font-size:13px;font-weight:600;
}
.add-row input::placeholder{color:var(--soft);font-weight:600}
.add-row button{border-radius:12px;padding:8px 14px;font-weight:800;background:var(--rosa);color:#fff;font-size:13px}
.vacio{font-size:12.5px;color:var(--soft);font-weight:600;padding:10px 0;text-align:center}

/* ---------- progreso ---------- */
.anillo{display:flex;align-items:center;gap:18px}
.anillo .num{font-family:'Poppins';font-size:40px;font-weight:700;line-height:1}
.hbar{margin:9px 0}
.hbar .lbl{display:flex;font-size:12.5px;font-weight:700;margin-bottom:4px}
.hbar .lbl span:last-child{margin-left:auto;color:var(--soft);font-weight:700}
.semanas{display:flex;gap:7px;align-items:flex-end;height:78px;margin-top:10px}
.semanas div{flex:1;background:var(--line);border-radius:8px 8px 4px 4px;position:relative;min-height:5px}
.semanas div b{
  position:absolute;bottom:-19px;left:0;right:0;text-align:center;
  font-size:9.5px;font-weight:700;color:var(--soft)
}
.semanas div i{display:block;position:absolute;bottom:0;left:0;right:0;background:var(--lav);border-radius:8px 8px 4px 4px}
.sync textarea{
  width:100%;border:2px solid var(--line);background:var(--card2);border-radius:14px;
  padding:10px;font-size:11px;font-family:ui-monospace,monospace;min-height:76px;resize:vertical;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border-radius:13px;padding:9px 15px;font-weight:800;font-size:13px;background:var(--card2);box-shadow:var(--shadow)}
.btn.pri{background:var(--rosa);color:#fff}
.btn.ghost{box-shadow:none;border:2px solid var(--line);color:var(--soft)}


/* ---------- acordeón de materias ---------- */
.acordeon{max-width:720px;margin:0 auto}
.card.mat{padding:14px 16px}
.card.mat.open{box-shadow:0 0 0 2.5px var(--lav),var(--shadow)}
.mat-head{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin:0}
.mat-tx{flex:1;min-width:0}
.mat-tx b{display:block;font-size:15.5px;font-weight:700}
.mat-tx .muted{display:block;font-size:11.5px;font-weight:600}
.mat-head .hrs{font-size:11.5px;font-weight:700;text-align:right;line-height:1.25;flex:none}
.mat-head .hrs .muted{font-size:10px}
.chev{flex:none;font-size:13px;color:var(--soft)}
.mat-body{margin-top:14px}
.rev-box{background:var(--card2);border-radius:16px;padding:13px;margin-top:10px}
.rev-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.rev-top b{font-size:13.5px}
.rev-top input[type=date]{
  border:2px solid var(--line);background:var(--card);border-radius:10px;
  padding:4px 8px;font-size:12px;font-weight:700;
}
.rev-box .uni{border-bottom-color:var(--line)}
.rev-box .add-row input{background:var(--card)}
.rev-box .add-row{flex-wrap:wrap}

/* ---------- agenda de fechas ---------- */
.agenda{margin-top:9px}
.ag-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ag-item:last-child{border-bottom:none}
.ag-dot{flex:none;width:9px;height:9px;border-radius:50%}
.ag-item b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item .muted{flex:1;font-size:11.5px;font-weight:600;white-space:nowrap}
.ag-item .cuenta{flex:none}

.hidden{display:none}
@media(min-width:860px){
  body{padding-bottom:24px}
  nav.tabs{
    position:static;background:none;backdrop-filter:none;border:none;
    padding:0;margin-bottom:16px;gap:8px;justify-content:flex-start;
  }
  nav.tabs button{flex:none;flex-direction:row;padding:9px 18px;font-size:13.5px;border-radius:99px;background:var(--card);box-shadow:var(--shadow)}
  nav.tabs button i{font-size:15px}
  nav.tabs button.on{background:var(--rosa);color:#fff}
  .brand h1{font-size:23px}
  .mono{width:36px;height:36px;border-radius:11px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:8px}
</style>
</head>

/* =========================================================
   2. GUARDADO
   ========================================================= */
const KEY = 'planner-semestre2';
let mem = {};
function raw(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } }
function rawSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }

const DB_BASE = {semanas:{}, temario:{}, revision:{}, controles:{}, ts:0};
let db = (()=>{ try{ return Object.assign({}, DB_BASE, JSON.parse(raw(KEY)||'{}')); }catch(e){ return {...DB_BASE}; } })();
function save(){ db.ts = Date.now(); rawSet(KEY, JSON.stringify(db)); subirPronto(); }

/* migracion de formatos viejos */
(function migrar(){
  Object.keys(db.revision||{}).forEach(k=>{
    if(typeof db.revision[k] === 'string') db.revision[k] = {r1:db.revision[k], r2:''};
  });
  Object.keys(db.temario||{}).forEach(k=>{
    (db.temario[k]||[]).forEach(u => { if(!u.r) u.r = 1; });
  });
  if(!db.controles) db.controles = {};
})();

function claveSemana(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dw = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dw);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const w = Math.ceil(((t - y0) / 864e5 + 1) / 7);
  return t.getUTCFullYear() + '-S' + String(w).padStart(2, '0');
}
const HOY = new Date();
const SK = claveSemana(HOY);
function sem(k){
  k = k || SK;
  if(!db.semanas[k]) db.semanas[k] = {check:{}, min:{}};
  if(!db.semanas[k].check) db.semanas[k].check = {};
  if(!db.semanas[k].min)   db.semanas[k].min   = {};
  return db.semanas[k];
}


/* =========================================================
   2b. SINCRONIZACIÓN AUTOMÁTICA  ·  celu <-> compu
   Pegá acá la URL de tu base de Firebase y listo.
   Si lo dejás vacío, funciona igual pero solo en este dispositivo.
   ========================================================= */
const SYNC = {
  url:   'https://planificacion-academica-fcea-default-rtdb.firebaseio.com',
  clave: 'fcea-zg9xc3upph'   // tu clave secreta: no la compartas ni la cambies
};

let estadoSync = SYNC.url ? 'esperando' : 'local';
let timerSubida = null;

function pintarEstado(){
  const el = document.getElementById('sync-luz');
  if(!el) return;
  const txt = {local:'', esperando:'⏳', ok:'☁️', error:'⚠️'};
  el.textContent = txt[estadoSync] || '';
  el.title = {local:'Guardado solo en este dispositivo', esperando:'Sincronizando…',
              ok:'Sincronizado', error:'No se pudo conectar'}[estadoSync] || '';
}

function nodo(){ return SYNC.url.replace(/\/$/,'') + '/planner/' + SYNC.clave + '.json'; }

function subirPronto(){
  if(!SYNC.url) return;
  clearTimeout(timerSubida);
  timerSubida = setTimeout(subir, 1200);
}
function subir(){
  if(!SYNC.url) return;
  estadoSync = 'esperando'; pintarEstado();
  fetch(nodo(), {method:'PUT', body: JSON.stringify(db)})
    .then(r => { estadoSync = r.ok ? 'ok' : 'error'; pintarEstado(); })
    .catch(() => { estadoSync = 'error'; pintarEstado(); });
}
function bajar(primera){
  if(!SYNC.url) return;
  fetch(nodo())
    .then(r => r.json())
    .then(remoto => {
      estadoSync = 'ok';
      if(remoto && remoto.semanas){
        if((remoto.ts||0) > (db.ts||0)){
          db = Object.assign({}, DB_BASE, remoto);
          rawSet(KEY, JSON.stringify(db));
          pintar();
        } else if(primera && (db.ts||0) > (remoto.ts||0)){
          subir();
        }
      } else if(primera){ subir(); }
      pintarEstado();
    })
    .catch(() => { estadoSync = 'error'; pintarEstado(); });
}

/* =========================================================
   3. HELPERS
   ========================================================= */
const $  = s => document.querySelector(s);
const idxHoy = (HOY.getDay() + 6) % 7;           // 0 = lunes
const mins = h => { const p = h.split(':'); return +p[0]*60 + +p[1]; };
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const dur  = b => (b.i && b.f) ? mins(b.f) - mins(b.i) : 30;
const hs   = m => m < 60 ? m + "'" : (m % 60 === 0 ? (m/60) + ' h' : Math.floor(m/60) + ' h ' + (m%60) + "'");
const esc  = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bid  = (d,j) => d.id + '-' + j;

function ahoraMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }

function metaMin(dia, m){ return sem().min[dia.id + '-' + m] || 0; }
function setMeta(dia, m, v){ sem().min[dia.id + '-' + m] = Math.max(0, v); save(); }

/* minutos planificados y hechos por materia en la semana */
function balance(k){
  const s = sem(k), plan = {}, hecho = {};
  DIAS.forEach(d => {
    if(d.flex){
      d.metas.forEach(mt => {
        plan[mt.m] = (plan[mt.m]||0) + mt.min;
        hecho[mt.m] = (hecho[mt.m]||0) + Math.min(s.min[d.id+'-'+mt.m]||0, mt.min);
      });
    } else {
      d.bloques.forEach((b,j) => {
        if(b.pausa) return;
        plan[b.m] = (plan[b.m]||0) + dur(b);
        if(s.check[bid(d,j)]) hecho[b.m] = (hecho[b.m]||0) + dur(b);
      });
    }
  });
  return {plan, hecho};
}
function porcentaje(k){
  const {plan, hecho} = balance(k);
  const p = Object.values(plan).reduce((a,b)=>a+b,0);
  const h = Object.values(hecho).reduce((a,b)=>a+b,0);
  return p ? Math.round(h/p*100) : 0;
}
function diaCompleto(d){
  const s = sem();
  if(d.flex) return d.metas.every(mt => (s.min[d.id+'-'+mt.m]||0) >= mt.min);
  return d.bloques.every((b,j) => b.pausa || s.check[bid(d,j)]);
}

/* =========================================================
   4. VISTA · HOY
   ========================================================= */
function bloqueActual(){
  const d = DIAS[idxHoy];
  if(d.flex) return null;
  const a = ahoraMin();
  for(let j=0;j<d.bloques.length;j++){
    const b = d.bloques[j];
    if(b.pausa) continue;
    if(b.i && a >= mins(b.i) && a < mins(b.f)) return {b, j, estado:'ahora'};
  }
  for(let j=0;j<d.bloques.length;j++){
    const b = d.bloques[j];
    if(!b.pausa && b.i && a < mins(b.i)) return {b, j, estado:'proximo'};
  }
  return null;
}

function renderHoy(){
  const d = DIAS[idxHoy];
  const act = bloqueActual();
  let hero;
  if(act){
    const m = MAT[act.b.m];
    const a = ahoraMin();
    if(act.estado === 'ahora'){
      const pct = Math.round((a - mins(act.b.i)) / dur(act.b) * 100);
      hero = `<div class="now">
        <div class="eyebrow">Ahora mismo</div>
        <h2>${m.e} ${esc(m.n)}</h2>
        <p>${esc(act.b.t)} · hasta las ${act.b.f} (te quedan ${hs(mins(act.b.f)-a)})</p>
        <div class="barra"><i style="width:${pct}%"></i></div>
      </div>`;
    } else {
      hero = `<div class="now">
        <div class="eyebrow">Lo que viene</div>
        <h2>${m.e} ${esc(m.n)}</h2>
        <p>${act.b.i} · ${esc(act.b.t)} · arranca en ${hs(mins(act.b.i)-a)}</p>
      </div>`;
    }
  } else {
    const pend = d.flex
      ? d.metas.filter(mt => metaMin(d,mt.m) < mt.min).map(mt => MAT[mt.m].n).join(' y ')
      : '';
    hero = `<div class="now">
      <div class="eyebrow">${d.e} ${esc(d.n)}</div>
      <h2>${d.flex ? (pend ? 'Te falta ' + esc(pend) : '¡Todo hecho! 🎀') : 'Día cerrado 🌙'}</h2>
      <p>${d.flex ? esc(d.foco) : 'No quedan bloques con horario por hoy'}</p>
    </div>`;
  }
  $('#v-hoy').innerHTML = hero + `<div class="card">${cardDia(d, true)}</div>`;
}

/* =========================================================
   5. TARJETA DE UN DÍA (riel o metas)
   ========================================================= */
function cardDia(d, solo){
  const completo = diaCompleto(d);
  let h = `<div class="dia-head">
      <h3>${d.e} ${esc(d.n)}</h3>
      <span class="pill ${completo?'full':''}">${completo ? '¡completo! ✨' : (d.flex ? 'a tu ritmo' : 'con horario')}</span>
    </div>
    <p class="foco">Foco: <b>${esc(d.foco)}</b></p>`;

  if(d.flex){
    d.metas.forEach(mt => {
      const m = MAT[mt.m], hechos = metaMin(d, mt.m);
      const pct = Math.min(100, Math.round(hechos/mt.min*100));
      h += `<div class="meta" style="border-left-color:${m.c}">
        <div class="mtop">
          <b>${m.e} ${esc(m.n)}</b>
          <span class="val" style="color:${m.c}">${hs(hechos)} / ${hs(mt.min)}</span>
        </div>
        <div class="bar"><i style="width:${pct}%;background:${m.c}"></i></div>
        <div class="plusminus">
          <button data-meta="${d.id}|${mt.m}|-30">−30'</button>
          <button data-meta="${d.id}|${mt.m}|30">+30'</button>
          <button data-meta="${d.id}|${mt.m}|60">+1 h</button>
          <button data-meta="${d.id}|${mt.m}|0">reset</button>
        </div>
        ${mt.tareas.length ? '<ul>' + mt.tareas.map(t=>`<li>${esc(t)}</li>`).join('') + '</ul>' : ''}
        ${mt.checklist ? mt.checklist.map((t,k)=>{
          const on = sem().check[d.id+'-rev-'+k];
          return `<button class="mini-check ${on?'done':''}" data-rev="${d.id}-rev-${k}">
                    <span class="tick">✓</span><span>${esc(t)}</span></button>`;
        }).join('') : ''}
      </div>`;
    });
    if(d.nota) h += `<p class="foco" style="margin:2px 0 0">${esc(d.nota)}</p>`;
    return h;
  }

  h += '<div class="riel">';
  let prevFin = null;
  d.bloques.forEach((b, j) => {
    if(b.i && prevFin !== null && mins(b.i) - prevFin >= 60){
      h += `<div class="hueco">· · · ${hs(mins(b.i)-prevFin)} · · ·</div>`;
    }
    if(b.pausa){
      h += `<div class="hueco" style="height:26px">☕ ${b.i} · ${esc(b.t)}</div>`;
      prevFin = mins(b.f);
      return;
    }
    const m = MAT[b.m], on = sem().check[bid(d,j)];
    const esHoy = (DIAS[idxHoy].id === d.id);
    const act = esHoy && b.i && ahoraMin() >= mins(b.i) && ahoraMin() < mins(b.f);
    h += `<button class="bloque ${on?'done':''} ${act?'ahora':''}" data-b="${bid(d,j)}" style="border-left-color:${m.c}">
      <span class="hora">${b.i ? b.i : 'antes'}${b.f ? '<small>'+b.f+'</small>' : '<small>19:00</small>'}</span>
      <span class="tick">✓</span>
      <span class="tx">
        <b>${m.e} ${esc(m.n)}</b>
        <span>${esc(b.t)}${b.d ? ' · ' + esc(b.d) : ''}</span>
      </span>
      ${act ? '<span class="flag">ahora</span>' : ''}
    </button>`;
    if(b.f) prevFin = mins(b.f);
  });
  h += '</div>';
  return h;
}

function renderSemana(){
  $('#v-semana').innerHTML = '<div class="grid">' +

    '</div>';

/* =========================================================
   7. VISTA · MATERIAS (temario + revisión)
   ========================================================= */
const CURSANDO = Object.keys(MAT).filter(k => MAT[k].prio).sort((a,b) => MAT[a].prio - MAT[b].prio);
const MEDALLA = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣'];
let abierta = null;

function rev(k){
  if(typeof db.revision[k] === 'string') db.revision[k] = {r1:db.revision[k], r2:''};
  if(!db.revision[k]) db.revision[k] = {r1:'', r2:''};
  return db.revision[k];
}
function ctrls(k){ if(!db.controles[k]) db.controles[k] = []; return db.controles[k]; }
function unis(k){  if(!db.temario[k])   db.temario[k]   = []; return db.temario[k]; }
function dias(f){  return f ? Math.ceil((new Date(f + 'T12:00') - HOY) / 864e5) : null; }
function fmt(f){   const d = new Date(f + 'T12:00'); return d.getDate() + '/' + (d.getMonth()+1); }
function cuando(d){
  if(d === null) return '';
  if(d < 0)  return 'ya pasó';
  if(d === 0) return '¡es hoy!';
  if(d === 1) return 'mañana';
  return 'en ' + d + ' días';
}
function claseUrgencia(d){ return d <= 7 ? 'mal' : (d <= 21 ? 'ojo' : 'bien'); }

/* todas las fechas del semestre, ordenadas */
function agenda(){
  const out = [];
  CURSANDO.forEach(k => {
    const r = rev(k);
    if(r.r1) out.push({k, t:'Revisión 1', f:r.r1, d:dias(r.r1)});
    if(r.r2) out.push({k, t:'Revisión 2', f:r.r2, d:dias(r.r2)});
    ctrls(k).forEach(c => { if(!c.ok && c.f) out.push({k, t:c.t || 'Control', f:c.f, d:dias(c.f), ctrl:true}); });
  });
  return out.filter(x => x.d >= 0).sort((a,b) => a.d - b.d);
}

/* un bloque de revisión con su temario */
function bloqueRev(k, rn){
  const m = MAT[k], r = rev(k), f = r['r'+rn];
  const lista = unis(k).map((u,j) => ({u,j})).filter(x => (x.u.r||1) === rn);
  const listas = lista.filter(x => x.u.ok).length;
  const pct = lista.length ? Math.round(listas/lista.length*100) : 0;
  const d = dias(f);
  const faltan = lista.length - listas;

  let chip = '<span class="cuenta">sin fecha</span>', ritmo = '';
  if(f){
    if(d < 0) chip = '<span class="cuenta">ya pasó</span>';
    else {
      const semanas = Math.max(1, Math.ceil(d/7));
      const porSem = faltan / semanas;
      const cl = faltan === 0 ? 'bien' : (porSem <= 1.5 ? 'bien' : (porSem <= 3 ? 'ojo' : 'mal'));
      chip = `<span class="cuenta ${cl}">${cuando(d)}</span>`;
      ritmo = faltan === 0
        ? '<b style="color:var(--menta)">temario terminado ✨</b>'
        : (lista.length ? `necesitás <b>${porSem.toFixed(1)} unidades por semana</b>` : '');
    }
  }

  return `<div class="rev-box">
    <div class="rev-top">
      <b>${rn === 1 ? '🍂 Revisión 1' : '🎄 Revisión 2'}</b>
      <input type="date" value="${f||''}" data-rev-fecha="${k}|r${rn}">
      ${chip}
    </div>
    ${lista.length ? `<div class="bar"><i style="width:${pct}%;background:${m.c}"></i></div>
      <p class="foco" style="margin:7px 0 6px">${listas}/${lista.length} unidades · ${pct}%${ritmo ? ' · ' + ritmo : ''}</p>` : ''}
    ${lista.length
      ? lista.map(x => `<div class="uni ${x.u.ok?'done':''}">
          <button class="tick" data-uni="${k}|${x.j}">✓</button>
          <button class="nm" data-uni="${k}|${x.j}">${esc(x.u.t)}</button>
          <button class="del" data-del="${k}|${x.j}" title="Borrar">×</button>
        </div>`).join('')
      : '<p class="vacio">Sin unidades cargadas todavía 🌷</p>'}
    <div class="add-row">
      <input placeholder="Unidad · tema" data-add="${k}|${rn}">
      <button data-addbtn="${k}|${rn}">Agregar</button>
    </div>
  </div>`;
}

/* controles de una materia */
function bloqueCtrl(k){
  const cs = ctrls(k);
  return `<div class="rev-box">
    <div class="rev-top"><b>📝 Controles del semestre</b></div>
    ${cs.length
      ? cs.map((c,j) => {
          const d = dias(c.f);
          return `<div class="uni ${c.ok?'done':''}">
            <button class="tick" data-ctrl="${k}|${j}">✓</button>
            <button class="nm" data-ctrl="${k}|${j}">${esc(c.t)}
              <em style="font-style:normal;color:var(--soft);font-weight:600">
                ${c.f ? ' · ' + fmt(c.f) + (c.ok ? '' : ' · ' + cuando(d)) : ''}
              </em>
            </button>
            <button class="del" data-cdel="${k}|${j}" title="Borrar">×</button>
          </div>`;
        }).join('')
      : '<p class="vacio">Todavía no cargaste controles</p>'}
    <div class="add-row">
      <input placeholder="Control 1" data-cadd-t="${k}" style="flex:2">
      <input type="date" data-cadd-f="${k}" style="flex:1.2;min-width:120px">
      <button data-caddbtn="${k}">Sumar</button>
    </div>
  </div>`;
}

function renderMaterias(){
  const {plan} = balance();
  const ag = agenda();

  let h = `<div class="card">
    <div class="eyebrow">Lo que viene</div>
    ${ag.length
      ? '<div class="agenda">' + ag.slice(0,6).map(x => {
          const m = MAT[x.k];
          return `<div class="ag-item">
            <span class="ag-dot" style="background:${m.c}"></span>
            <b>${m.e} ${esc(m.n)}</b>
            <span class="muted">${esc(x.t)}</span>
            <span class="cuenta ${claseUrgencia(x.d)}">${cuando(x.d)}</span>
          </div>`;
        }).join('') + '</div>'
      : '<p class="foco" style="margin:6px 0 0">Cargá las fechas de las revisiones y de los controles y te van a aparecer acá, ordenadas por cercanía.</p>'}
  </div>`;

  h += '<div class="acordeon">' + CURSANDO.map(k => {
    const m = MAT[k];
    const t = unis(k);
    const listas = t.filter(u => u.ok).length;
    const pct = t.length ? Math.round(listas/t.length*100) : 0;
    const prox = ag.filter(x => x.k === k)[0];
    const open = abierta === k;
    return `<div class="card mat ${open?'open':''}">
      <button class="mat-head" data-acc="${k}">
        <span class="rank" style="background:${m.c}33;color:${m.c}">${MEDALLA[m.prio-1]}</span>
        <span class="mat-tx">
          <b>${m.e} ${esc(m.n)}</b>
          <span class="muted">${t.length ? listas + '/' + t.length + ' unidades · ' + pct + '%' : 'sin temario'}${prox ? ' · ' + esc(prox.t) + ' ' + cuando(prox.d) : ''}</span>
        </span>
        <span class="hrs">${plan[k] ? hs(plan[k]) : '—'}<br><span class="muted">semanal</span></span>
        <span class="chev">${open ? '▾' : '▸'}</span>
      </button>
      ${t.length ? `<div class="bar" style="margin-top:2px"><i style="width:${pct}%;background:${m.c}"></i></div>` : ''}
      ${open ? `<div class="mat-body">${bloqueRev(k,1)}${bloqueRev(k,2)}${bloqueCtrl(k)}</div>` : ''}
    </div>`;
  }).join('') + '</div>';

  $('#v-materias').innerHTML = h;
}

/* =========================================================
   8. VISTA · PROGRESO
   ========================================================= */
function renderProgreso(){
  const pct = porcentaje();
  const {plan, hecho} = balance();
  const claves = Object.keys(db.semanas).sort().slice(-8);

  let h = `<div class="card">
    <div class="anillo">
      <div>
        <div class="eyebrow">Esta semana</div>
        <div class="num" style="color:var(--rosa)">${pct}%</div>
      </div>
      <div style="flex:1">
        <div class="bar" style="height:14px"><i style="width:${pct}%;background:linear-gradient(90deg,var(--rosa),var(--lav))"></i></div>
        <p class="foco" style="margin:8px 0 0">${
          pct >= 90 ? 'Semana redonda, sos una genia 🎀' :
          pct >= 60 ? 'Vas bien, no aflojes 🌷' :
          pct >= 30 ? 'Falta, pero hay semana por delante 🩷' :
                      'Arrancá por lo de hoy y listo 💗'}</p>
      </div>
    </div>
  </div>`;

  h += '<div class="card"><div class="eyebrow">Horas por materia</div>';
  CURSANDO.forEach(k => {
    if(!plan[k]) return;
    const m = MAT[k], hh = hecho[k] || 0;
    h += `<div class="hbar">
      <div class="lbl"><span>${m.e} ${esc(m.n)}</span><span>${hs(hh)} / ${hs(plan[k])}</span></div>
      <div class="bar"><i style="width:${Math.round(hh/plan[k]*100)}%;background:${m.c}"></i></div>
    </div>`;
  });
  h += '</div>';

  h += `<div class="card"><div class="eyebrow">Últimas semanas</div>
    <div class="semanas">${
      claves.length
        ? claves.map(k => { const p = porcentaje(k);
            return `<div><i style="height:${Math.max(4,p)}%;${k===SK?'background:var(--rosa)':''}"></i><b>${k.split('-S')[1]}</b></div>`;
          }).join('')
        : '<p class="vacio">Todavía no hay historial</p>'
    }</div><p class="foco" style="margin:26px 0 0">Cada barra es una semana. La rosada es la de ahora.</p></div>`;

  h += `<div class="card sync">
    <div class="eyebrow">Pasar de la compu al celu</div>
    <p class="foco" style="margin:6px 0 10px">Copiá el código de un dispositivo y pegalo en el otro.</p>
    <textarea id="codigo" placeholder="Acá aparece / pegás el código"></textarea>
    <div class="btn-row">
      <button class="btn pri" id="b-exp">Generar código</button>
      <button class="btn" id="b-imp">Cargar código</button>
      <button class="btn ghost" id="b-reset">Reiniciar esta semana</button>
    </div>
  </div>`;

  $('#v-progreso').innerHTML = h;
}

/* =========================================================
   9. EVENTOS
   ========================================================= */
function pintar(){
  renderHoy(); renderSemana(); renderMaterias(); renderProgreso();
  const lun = new Date(HOY); lun.setDate(HOY.getDate() - idxHoy);
  const dom = new Date(lun);  dom.setDate(lun.getDate() + 6);
  const f = d => d.getDate() + '/' + (d.getMonth()+1);
  $('#rango').textContent = 'Semana del ' + f(lun) + ' al ' + f(dom) + ' · hiciste el ' + porcentaje() + '% de esta semana';
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-b],[data-meta],[data-rev],[data-uni],[data-del],[data-addbtn],[data-caddbtn],[data-ctrl],[data-cdel],[data-acc],[data-v],#b-exp,#b-imp,#b-reset,#btn-tema');
  if(!t) return;

  if(t.dataset.v){
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b === t));
    ['hoy','semana','materias','progreso'].forEach(v => $('#v-'+v).classList.toggle('hidden', v !== t.dataset.v));
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  if(t.id === 'btn-tema'){
    const n = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
    document.documentElement.dataset.theme = n;
    t.textContent = n === 'night' ? '☀️' : '🌙';
    rawSet(KEY + '-tema', n);
    const mc = document.getElementById('meta-color');
    if(mc) mc.content = (n === 'night') ? '#241B33' : '#FFF7FB';
    return;
  }
  if(t.dataset.b){
    const s = sem(); s.check[t.dataset.b] = !s.check[t.dataset.b]; save(); pintar(); return;
  }
  if(t.dataset.rev){
    const s = sem(); s.check[t.dataset.rev] = !s.check[t.dataset.rev]; save(); pintar(); return;
  }
  if(t.dataset.meta){
    const [dia, m, delta] = t.dataset.meta.split('|');
    const d = DIAS.find(x => x.id === dia);
    setMeta(d, m, +delta === 0 ? 0 : metaMin(d, m) + (+delta));
    pintar(); return;
  }
  if(t.dataset.uni){
    const [k, j] = t.dataset.uni.split('|');
    db.temario[k][+j].ok = !db.temario[k][+j].ok; save(); renderMaterias(); return;
  }
  if(t.dataset.del){
    const [k, j] = t.dataset.del.split('|');
    db.temario[k].splice(+j, 1); save(); renderMaterias(); return;
  }
  if(t.dataset.acc){
    abierta = (abierta === t.dataset.acc) ? null : t.dataset.acc;
    renderMaterias(); return;
  }
  if(t.dataset.addbtn){ agregar(t.dataset.addbtn); return; }
  if(t.dataset.caddbtn){ agregarCtrl(t.dataset.caddbtn); return; }
  if(t.dataset.ctrl){
    const [k, j] = t.dataset.ctrl.split('|');
    ctrls(k)[+j].ok = !ctrls(k)[+j].ok; save(); renderMaterias(); return;
  }
  if(t.dataset.cdel){
    const [k, j] = t.dataset.cdel.split('|');
    ctrls(k).splice(+j, 1); save(); renderMaterias(); return;
  }

  if(t.id === 'b-exp'){ $('#codigo').value = btoa(unescape(encodeURIComponent(JSON.stringify(db)))); $('#codigo').select(); return; }
  if(t.id === 'b-imp'){
    try{
      db = Object.assign({}, DB_BASE, JSON.parse(decodeURIComponent(escape(atob($('#codigo').value.trim())))));
      save(); pintar();
    }catch(e){ alert('Ese código no se pudo leer. Copialo entero e intentá de nuevo.'); }
    return;
  }
  if(t.id === 'b-reset'){
    if(confirm('¿Borrar los tildes y las horas de esta semana? El temario no se toca.')){
      db.semanas[SK] = {check:{}, min:{}}; save(); pintar();
    }
    return;
  }
});

function agregar(ref){
  const inp = document.querySelector('[data-add="' + ref + '"]');
  if(!inp) return;
  const v = inp.value.trim();
  if(!v) return;
  const [k, rn] = ref.split('|');
  unis(k).push({t:v, ok:false, r:+rn});
  save(); renderMaterias();
  const nuevo = document.querySelector('[data-add="' + ref + '"]');
  if(nuevo) nuevo.focus();
}

function agregarCtrl(k){
  const it = document.querySelector('[data-cadd-t="' + k + '"]');
  const iff = document.querySelector('[data-cadd-f="' + k + '"]');
  const v = it.value.trim();
  if(!v && !iff.value) return;
  ctrls(k).push({t: v || 'Control', f: iff.value, ok:false});
  ctrls(k).sort((a,b) => (a.f||'9999').localeCompare(b.f||'9999'));
  save(); renderMaterias();
  const nuevo = document.querySelector('[data-cadd-t="' + k + '"]');
  if(nuevo) nuevo.focus();
}

document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter' || !ev.target.dataset) return;
  if(ev.target.dataset.add)   agregar(ev.target.dataset.add);
  if(ev.target.dataset.caddT) agregarCtrl(ev.target.dataset.caddT);
});
document.addEventListener('change', ev => {
  const ref = ev.target.dataset ? ev.target.dataset.revFecha : null;
  if(ref){
    const [k, rn] = ref.split('|');
    rev(k)[rn] = ev.target.value; save(); renderMaterias();
  }
});

/* arranque */
const tema = raw(KEY + '-tema');
if(tema === 'night'){ document.documentElement.dataset.theme = 'night'; $('#btn-tema').textContent = '☀️'; }
pintar();
pintarEstado();
if(SYNC.url){ bajar(true); setInterval(() => bajar(false), 10000); }
setInterval(() => { renderHoy(); }, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
