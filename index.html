<title>Mi semestre 🎀 · Planificación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7FB; --bg2:#F3EEFF;
  --card:#FFFFFF; --card2:#FFF2F8;
  --ink:#4B3A55; --soft:#8E7C9B;
  --rosa:#FF8FB8; --lav:#B196EE; --menta:#6FD3B7;
  --line:#F1E4F3;
  --shadow:0 6px 20px rgba(178,138,200,.14);
  --r:20px;
}
[data-theme="night"]{
  --bg:#241B33; --bg2:#1A1427;
  --card:#2F2442; --card2:#382B4E;
  --ink:#F4E9FB; --soft:#B7A5CB;
  --line:#453660;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Quicksand',system-ui,sans-serif;
  background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-size:15.5px;line-height:1.5;
  padding-bottom:88px;
  transition:background .3s,color .3s;
}
h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;color:inherit}

/* ---------- estructura ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{
  display:flex;align-items:center;gap:12px;
  padding:max(20px,env(safe-area-inset-top)) 0 12px;
}
.brand h1{font-size:19px;display:flex;align-items:center;gap:9px}
.mono{width:30px;height:30px;flex:none;display:block}
.mono svg{width:100%;height:100%;border-radius:9px;display:block}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--soft);font-weight:600}
.spacer{flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:14px;background:var(--card);
  box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;
  transition:transform .15s;
}
.icon-btn:active{transform:scale(.92)}

/* tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
nav.tabs button{
  flex:1;border-radius:14px;padding:6px 2px;font-size:9.5px;font-weight:700;letter-spacing:-.01em;
  color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background .2s,color .2s;
}
nav.tabs button i{font-style:normal;font-size:17px;line-height:1}
nav.tabs button.on{background:var(--card2);color:var(--rosa)}

/* ---------- tarjetas ---------- */
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;
}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.muted{color:var(--soft)}

/* ---------- HOY: el bloque de ahora ---------- */
.now{
  background:linear-gradient(135deg,var(--rosa),var(--lav));
  color:#fff;border-radius:26px;padding:20px 18px;margin-bottom:16px;
  box-shadow:0 10px 26px rgba(200,140,190,.32);position:relative;overflow:hidden;
}
.now::after{
  content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
  border-radius:50%;background:rgba(255,255,255,.14);
}
.now .eyebrow{color:rgba(255,255,255,.82)}
.now h2{font-size:24px;margin:6px 0 2px;position:relative}
.now p{margin:0;font-size:13.5px;opacity:.92;position:relative}
.now .barra{height:6px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:14px;overflow:hidden;position:relative}
.now .barra i{display:block;height:100%;background:#fff;border-radius:99px}

/* ---------- el riel del día ---------- */
.dia-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.dia-head h3{font-size:16.5px}
.dia-head .pill{
  margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;
  background:var(--card2);color:var(--soft)
}
.dia-head .pill.full{background:var(--menta);color:#134438}
.foco{font-size:12.5px;color:var(--soft);font-weight:600;margin:0 0 12px}
.foco b{color:var(--ink)}

.riel{position:relative;padding-left:52px}
.riel .hueco{
  position:relative;height:22px;
  display:flex;align-items:center;font-size:10.5px;color:var(--soft);font-weight:600;
}
.riel .hueco::before{
  content:"";position:absolute;left:-30px;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 9px);
}
.bloque{
  position:relative;border-radius:16px;padding:11px 13px;margin-bottom:8px;
  background:var(--card2);display:flex;gap:10px;align-items:flex-start;
  border-left:4px solid var(--line);transition:opacity .2s,transform .12s;
  text-align:left;width:100%;
}
.bloque:active{transform:scale(.985)}
.bloque .hora{
  position:absolute;left:-52px;top:12px;width:44px;text-align:right;
  font-size:11.5px;font-weight:700;color:var(--soft);line-height:1.25;
}
.bloque .hora small{display:block;font-size:9.5px;font-weight:600;opacity:.7}
.bloque .tick{
  flex:none;width:22px;height:22px;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:transparent;margin-top:1px;
  transition:background .2s,border-color .2s;
}
.bloque .tx{flex:1;min-width:0}
.bloque .tx b{display:block;font-size:14px;font-weight:700}
.bloque .tx span{display:block;font-size:12.5px;color:var(--soft);font-weight:600}
.bloque.done{opacity:.55}
.bloque.done .tick{background:var(--menta);border-color:var(--menta);color:#fff}
.bloque.done .tx b{text-decoration:line-through}
.bloque.ahora{box-shadow:0 0 0 2.5px var(--rosa);background:var(--card)}
.bloque .flag{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;background:var(--rosa);color:#fff;align-self:center;
}

/* ---------- metas flexibles (finde) ---------- */
.meta{border-radius:18px;padding:14px;background:var(--card2);margin-bottom:10px;border-left:4px solid var(--line)}
.meta .mtop{display:flex;align-items:center;gap:8px}
.meta .mtop b{font-size:14.5px}
.meta .mtop .val{margin-left:auto;font-size:13px;font-weight:700}
.meta ul{margin:9px 0 0;padding-left:17px;font-size:12.5px;color:var(--soft);font-weight:600}
.meta ul li{margin:2px 0}
.bar{height:9px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.plusminus{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.plusminus button{
  border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:700;
  background:var(--card);box-shadow:var(--shadow);transition:transform .12s
}
.plusminus button:active{transform:scale(.93)}
.mini-check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:5px 0;width:100%;text-align:left}
.mini-check .tick{flex:none;width:19px;height:19px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.mini-check.done .tick{background:var(--menta);border-color:var(--menta);color:#fff}
.mini-check.done span{text-decoration:line-through;opacity:.6}

/* ---------- grilla semana ---------- */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){ .grid{grid-template-columns:1fr 1fr} }
@media(min-width:1020px){ .grid{grid-template-columns:1fr 1fr 1fr} }

/* ---------- materias ---------- */
.mat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank{
  flex:none;width:30px;height:30px;border-radius:11px;display:grid;place-items:center;
  font-size:13px;font-weight:800;background:var(--card2)
}
.mat-head h3{font-size:16px;flex:1;min-width:0}
.mat-head .hrs{font-size:11.5px;font-weight:700;color:var(--soft);text-align:right;line-height:1.3}
.fecha-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:10px;flex-wrap:wrap}
.fecha-row input{
  border:2px solid var(--line);background:var(--card2);border-radius:11px;
  padding:5px 9px;font-size:12.5px;font-weight:700;
}
.cuenta{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2)}
.cuenta.bien{background:#6FD3B733;color:var(--menta)}
.cuenta.ojo{background:#FFB74D33;color:#E08A1E}
.cuenta.mal{background:#FF8FB833;color:var(--rosa)}
.uni{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line)}
.uni:last-of-type{border-bottom:none}
.uni .tick{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.uni.done .tick{background:var(--lav);border-color:var(--lav);color:#fff}
.uni .nm{flex:1;font-size:13px;font-weight:600;text-align:left;min-width:0}
.uni.done .nm{text-decoration:line-through;opacity:.55}
.uni .del{font-size:15px;color:var(--soft);opacity:.5;padding:0 3px}
.add-row{display:flex;gap:7px;margin-top:10px}
.add-row input{
  flex:1;min-width:0;border:2px solid var(--line);background:var(--card2);
  border-radius:12px;padding:8px 11px;font-size:13px;font-weight:600;
}
.add-row input::placeholder{color:var(--soft);font-weight:600}
.add-row button{border-radius:12px;padding:8px 14px;font-weight:800;background:var(--rosa);color:#fff;font-size:13px}
.vacio{font-size:12.5px;color:var(--soft);font-weight:600;padding:10px 0;text-align:center}

/* ---------- progreso ---------- */
.anillo{display:flex;align-items:center;gap:18px}
.anillo .num{font-family:'Poppins';font-size:40px;font-weight:700;line-height:1}
.hbar{margin:9px 0}
.hbar .lbl{display:flex;font-size:12.5px;font-weight:700;margin-bottom:4px}
.hbar .lbl span:last-child{margin-left:auto;color:var(--soft);font-weight:700}
.semanas{display:flex;gap:7px;align-items:flex-end;height:78px;margin-top:10px}
.semanas div{flex:1;background:var(--line);border-radius:8px 8px 4px 4px;position:relative;min-height:5px}
.semanas div b{
  position:absolute;bottom:-19px;left:0;right:0;text-align:center;
  font-size:9.5px;font-weight:700;color:var(--soft)
}
.semanas div i{display:block;position:absolute;bottom:0;left:0;right:0;background:var(--lav);border-radius:8px 8px 4px 4px}
.sync textarea{
  width:100%;border:2px solid var(--line);background:var(--card2);border-radius:14px;
  padding:10px;font-size:11px;font-family:ui-monospace,monospace;min-height:76px;resize:vertical;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border-radius:13px;padding:9px 15px;font-weight:800;font-size:13px;background:var(--card2);box-shadow:var(--shadow)}
.btn.pri{background:var(--rosa);color:#fff}
.btn.ghost{box-shadow:none;border:2px solid var(--line);color:var(--soft)}


/* ---------- acordeón de materias ---------- */
.acordeon{max-width:720px;margin:0 auto}
.card.mat{padding:14px 16px}
.card.mat.open{box-shadow:0 0 0 2.5px var(--lav),var(--shadow)}
.mat-head{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin:0}
.mat-tx{flex:1;min-width:0}
.mat-tx b{display:block;font-size:15.5px;font-weight:700}
.mat-tx .muted{display:block;font-size:11.5px;font-weight:600}
.mat-head .hrs{font-size:11.5px;font-weight:700;text-align:right;line-height:1.25;flex:none}
.mat-head .hrs .muted{font-size:10px}
.chev{flex:none;font-size:13px;color:var(--soft)}
.mat-body{margin-top:14px}
.rev-box{background:var(--card2);border-radius:16px;padding:13px;margin-top:10px}
.rev-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.rev-top b{font-size:13.5px}
.rev-top input[type=date]{
  border:2px solid var(--line);background:var(--card);border-radius:10px;
  padding:4px 8px;font-size:12px;font-weight:700;
}
.rev-box .uni{border-bottom-color:var(--line)}
.rev-box .add-row input{background:var(--card)}
.rev-box .add-row{flex-wrap:wrap}

/* ---------- agenda de fechas ---------- */
.agenda{margin-top:9px}
.ag-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ag-item:last-child{border-bottom:none}
.ag-dot{flex:none;width:9px;height:9px;border-radius:50%}
.ag-item b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item .muted{flex:1;font-size:11.5px;font-weight:600;white-space:nowrap}
.ag-item .cuenta{flex:none}

/* ---------- edición ---------- */
.icon-btn.on{background:var(--lav);color:#fff}
.bloque{cursor:pointer}
.nota-lin{display:block;font-size:12px;font-weight:700;color:var(--lav);margin-top:4px;white-space:pre-wrap}
.bq-ico{flex:none;align-self:center;font-size:13px;opacity:.4;padding:5px 6px;line-height:1;border-radius:9px}
.bq-ico.on{opacity:1}
.bq-ico:active{transform:scale(.9)}
.lapiz{font-size:13px;opacity:.65;padding:3px 6px;line-height:1;border-radius:9px}
.btn.mini{padding:8px 14px;font-size:12.5px;border-radius:13px;box-shadow:none;border:2px dashed var(--line);color:var(--soft);width:100%;margin-top:2px}
.aviso-edit{
  display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--lav),var(--rosa));border-radius:16px;padding:11px 14px;margin-bottom:14px;
}
.edit-on .bloque,.edit-on .meta{box-shadow:0 0 0 2px var(--lav) inset}

/* ---------- hoja de edición ---------- */
.hoja{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.hoja-bg{position:absolute;inset:0;background:rgba(62,42,84,.45)}
.hoja-in{
  position:relative;width:100%;max-width:470px;max-height:88vh;overflow:auto;
  background:var(--card);border-radius:26px 26px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 34px rgba(120,80,150,.3);
}
.hoja-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hoja-head h3{font-size:17px;flex:1;min-width:0}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.campo input,.campo select,.campo textarea{
  width:100%;border:2px solid var(--line);background:var(--card2);border-radius:13px;
  padding:10px 11px;font-size:14.5px;font-weight:600;
}
.campo textarea{min-height:64px;resize:vertical;line-height:1.45}
.dos{display:flex;gap:9px}
.dos .campo{flex:1;min-width:0}
.pista{font-size:11.5px;color:var(--soft);font-weight:600;margin:-4px 0 12px}
@media(min-width:720px){
  .hoja{align-items:center}
  .hoja-in{border-radius:26px;margin:0 16px}
}

/* ---------- calendario ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head b{flex:1;font-size:15.5px;text-transform:capitalize}
.cal-nav{width:32px;height:32px;border-radius:11px;background:var(--card2);color:var(--soft);font-size:15px;flex:none}
.cal-nav:active{transform:scale(.92)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-size:10px;font-weight:800;color:var(--soft);padding:3px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-d{
  aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--tinta);
  background:var(--card2);position:relative;padding:0;
}
.cal-d.off{background:transparent;color:transparent;pointer-events:none}
.cal-d.hoy{background:var(--rosa);color:#fff;box-shadow:0 3px 10px rgba(255,143,184,.4)}
.cal-d.sel{outline:2px solid var(--lav);outline-offset:-2px}
.cal-pts{display:flex;gap:2px;height:5px;align-items:center}
.cal-pts i{width:5px;height:5px;border-radius:50%;display:block}
.cal-nota{font-size:11.5px;color:var(--soft);font-weight:600;margin:12px 0 0;text-align:center}

/* ---------- fechas / instancias ---------- */
.inst{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:15px;background:var(--card2);margin-bottom:7px}
.inst .ib{flex:1;min-width:0;text-align:left;background:none;padding:0}
.inst .ib b{display:block;font-size:14px}
.inst .ib span{display:block;font-size:12px;color:var(--soft);font-weight:600;margin-top:2px}
.inst .ib em{font-style:normal;color:var(--lav);font-weight:700}
.chip{
  font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;flex:none;
  background:var(--card);color:var(--soft);letter-spacing:.02em;
}
.chip.mvd{background:#FFE4F0;color:#D9548A}
.chip.tbo{background:#E4F5EE;color:#2F8D6E}
[data-tema=noche] .chip.mvd{background:#4A2B3C;color:#FFA9CB}
[data-tema=noche] .chip.tbo{background:#23453A;color:#7FD8B8}

/* ---------- notas ---------- */
.nt{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px dashed var(--line)}
.nt:last-child{border-bottom:none}
.nt .nm2{flex:1;min-width:0;font-size:13.5px;font-weight:700;text-align:left;background:none;padding:0}
.nt .nm2 span{display:block;font-size:11px;color:var(--soft);font-weight:600}
.nt input{
  width:52px;flex:none;text-align:center;border:2px solid var(--line);background:var(--card2);
  border-radius:10px;padding:6px 2px;font-size:13.5px;font-weight:800;
}
.nt input.n-nota{background:#FFF0F7;border-color:var(--rosa);color:var(--rosa)}
[data-tema=noche] .nt input.n-nota{background:#4A2B3C}
.nt-h{display:flex;gap:7px;align-items:center;font-size:9.5px;font-weight:800;color:var(--soft);
      text-transform:uppercase;letter-spacing:.05em;padding-bottom:5px}
.nt-h .nm2{flex:1}
.nt-h span{width:52px;flex:none;text-align:center}
.veredicto{border-radius:16px;padding:12px 14px;margin-top:11px;font-size:13px;font-weight:700;line-height:1.5}
.veredicto.si{background:#E4F5EE;color:#2F8D6E}
.veredicto.no{background:#FFE6E9;color:#C9506A}
.veredicto.qz{background:#FFF3E0;color:#B4762A}
[data-tema=noche] .veredicto.si{background:#23453A;color:#7FD8B8}
[data-tema=noche] .veredicto.no{background:#4A2530;color:#FF9DB0}
[data-tema=noche] .veredicto.qz{background:#453521;color:#F0C07A}
.cfg-row{display:flex;gap:7px;margin-bottom:11px}
.cfg-row .campo{flex:1;margin-bottom:0}

/* ---------- pendientes ---------- */
.pd{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pd:last-child{border-bottom:none}
.pd .tick{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;
  color:transparent;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
}
.pd.done .tick{background:var(--menta);border-color:var(--menta);color:#fff}
.pd.done .nm3{text-decoration:line-through;opacity:.5}
.pd .nm3{flex:1;min-width:0;text-align:left;background:none;padding:0;font-size:13.5px;font-weight:600}
.pd .nm3 span{display:block;font-size:11px;color:var(--soft);font-weight:700;margin-top:1px}
.pd .del{color:var(--soft);font-size:16px;padding:2px 5px;flex:none;opacity:.5}
.alerta{
  display:flex;align-items:center;gap:9px;border-radius:18px;padding:12px 14px;margin-bottom:14px;
  background:linear-gradient(120deg,#FFB4CE,#C9A7F0);color:#fff;font-size:13px;font-weight:700;line-height:1.45;
}
.alerta i{font-style:normal;font-size:19px;flex:none}
.sem-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sem-row:last-child{border-bottom:none}
.sem-row b{font-size:12.5px;width:64px;flex:none;color:var(--soft)}
.sem-row .bar{flex:1;margin:0}
.sem-row em{font-style:normal;font-size:12px;font-weight:800;width:42px;text-align:right;flex:none}

.hidden{display:none}
@media(min-width:860px){
  body{padding-bottom:24px}
  nav.tabs{
    position:static;background:none;backdrop-filter:none;border:none;
    padding:0;margin-bottom:16px;gap:8px;justify-content:flex-start;
  }
  nav.tabs button{flex:none;flex-direction:row;padding:9px 18px;font-size:13.5px;border-radius:99px;background:var(--card);box-shadow:var(--shadow)}
  nav.tabs button i{font-size:15px}
  nav.tabs button.on{background:var(--rosa);color:#fff}
  .brand h1{font-size:23px}
  .mono{width:36px;height:36px}
  .mono svg{border-radius:11px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:8px}

<script>
/* =========================================================
   1. DATOS  ·  editá acá si cambia tu rutina
   ========================================================= */

const MAT = {
  gg1:    {n:'GG1',                  e:'🧾', c:'#FF9DBC', prio:1},
  calc:   {n:'Cálculo',              e:'📐', c:'#A98BEE', prio:2},
  aygo:   {n:'AYGO II',              e:'📚', c:'#FF7FB0', prio:3},
  eco:    {n:'Economía Descriptiva', e:'📖', c:'#5FCBAD', prio:4},
  der:    {n:'Derecho',              e:'⚖️', c:'#7FB4F0', prio:5},
  macro:  {n:'Macroeconomía',        e:'📊', c:'#F5B75C', prio:6},
  cpol:   {n:'Ciencia Política',     e:'🏛️', c:'#CE9AEA', prio:7},
  margen: {n:'Margen',               e:'🌙', c:'#BCAEDC'},
  rev:    {n:'Revisión semanal',     e:'🗓️', c:'#F09BCF'}
};

const DIAS_BASE = [
  {id:'lun', n:'Lunes', e:'🌷', foco:'AYGO II + dejar Derecho al día', bloques:[
    {i:'12:00', f:'14:00', m:'der',    t:'Clase',              d:'Durante el trabajo'},
    {i:'19:00', f:'21:00', m:'aygo',   t:'Clase',              d:'Resumen en paralelo'},
    {i:'21:00', f:'22:00', m:'der',    t:'Resumen de la clase',d:''},
    {i:'22:00', f:'22:30', m:'margen', t:'Margen',             d:'Completar pendiente / ordenar'}
  ]},
  {id:'mar', n:'Martes', e:'🩷', foco:'Economía + mantener contacto con GG1', bloques:[
    {i:'19:00', f:'21:00', m:'eco',    t:'Clase',              d:''},
    {i:'21:00', f:'22:00', m:'eco',    t:'Procesar clase anterior', d:'Resumen'},
    {i:'22:00', f:'22:30', m:'gg1',    t:'Avance corto',       d:'No perder el hilo'}
  ]},
  {id:'mie', n:'Miércoles', e:'🦋', foco:'AYGO II + GG1', bloques:[
    {i:'08:00', f:'10:00', m:'macro',  t:'Clase de fondo',     d:'Escuchar mientras trabajás'},
    {i:'19:00', f:'21:00', m:'aygo',   t:'Clase',              d:'Resumen en paralelo'},
    {i:'21:00', f:'22:30', m:'gg1',    t:'Curso',              d:'Teoría / resumen / práctica'}
  ]},
  {id:'jue', n:'Jueves', e:'🌸', foco:'Economía al día + GG1', bloques:[
    {i:null, f:null, m:'eco', t:'Cerrar resumen pendiente', d:'Antes de las 19:00, si quedó algo', libre:true},
    {i:'19:00', f:'21:00', m:'eco',    t:'Clase',              d:''},
    {i:'21:00', f:'22:30', m:'gg1',    t:'Curso',              d:'Resumen / práctico'}
  ]},
  {id:'vie', n:'Viernes', e:'🪻', foco:'Cálculo + Macro', bloques:[
    {i:'08:00', f:'10:00', m:'macro',  t:'Clase de fondo',     d:'Escuchar mientras trabajás'},
    {i:'19:00', f:'20:30', m:'calc',   t:'Manual + grabadas',  d:'Ejercicios'},
    {i:'20:30', f:'20:45', pausa:true, t:'Descanso / cena ☕'},
    {i:'20:45', f:'22:00', m:'macro',  t:'Estudiar + resumir', d:'La clase de la mañana'},
    {i:'22:00', f:'22:30', m:'margen', t:'Margen',             d:''}
  ]},
  {id:'sab', n:'Sábado', e:'🧁', flex:true, foco:'Sin horarios: elegís vos cuándo', metas:[
    {m:'gg1',  min:120, tareas:['Continuar clases del curso','Completar resúmenes','Avanzar en el práctico','Resolver ejercicios pendientes']},
    {m:'calc', min:120, tareas:['Continuar manual / clases grabadas','Resolver ejercicios','Entender antes de avanzar']}
  ], nota:'Si GG1 viene pesada esta semana, dale más tiempo 🎀'},
  {id:'dom', n:'Domingo', e:'🩰', flex:true, foco:'Bloque flexible + cierre de semana', metas:[
    {m:'cpol', min:90, tareas:['Avanzar bibliografía / temario','Hacer resumen','Clase grabada si necesitás reforzar']},
    {m:'rev',  min:45, tareas:[], checklist:[
      'Ver qué quedó pendiente',
      'Comprobar que los resúmenes estén al día',
      'Revisar qué viene la semana que viene',
      'Decidir dónde reforzar GG1 o Cálculo'
    ]}
  ], nota:'Después de esto: domingo libre 🌸'}
];

/* =========================================================
   2. GUARDADO
   ========================================================= */
const KEY = 'planner-semestre2';
let mem = {};
function raw(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } }
function rawSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }

const DB_BASE = {semanas:{}, temario:{}, revision:{}, controles:{}, notas:{}, pend:[], rutina:null, ts:0};
let db = (()=>{ try{ return Object.assign({}, DB_BASE, JSON.parse(raw(KEY)||'{}')); }catch(e){ return {...DB_BASE}; } })();
function save(){ db.ts = Date.now(); rawSet(KEY, JSON.stringify(db)); subirPronto(); }

/* migracion de formatos viejos */
(function migrar(){
  Object.keys(db.revision||{}).forEach(k=>{
    if(typeof db.revision[k] === 'string') db.revision[k] = {r1:db.revision[k], r2:''};
  });
  Object.keys(db.temario||{}).forEach(k=>{
    (db.temario[k]||[]).forEach(u => { if(!u.r) u.r = 1; });
  });
  if(!db.controles) db.controles = {};
  if(!db.notas) db.notas = {};
  if(!Array.isArray(db.pend)) db.pend = [];
  /* los controles necesitan id propio para poder colgarles la nota */
  Object.keys(db.controles).forEach(k => (db.controles[k]||[]).forEach(c => {
    if(!c.id) c.id = 'c' + Math.random().toString(36).slice(2,7);
  }));
})();

/* =========================================================
   2a. RUTINA EDITABLE
   La rutina deja de estar clavada en el código: vive en el
   guardado, así la podés cambiar desde el celu o la compu.
   ========================================================= */
let DIAS = [];

function clon(x){ return JSON.parse(JSON.stringify(x)); }
function nuevoId(pre){ return pre + '-' + Math.random().toString(36).slice(2, 7); }
function aMin(h){ return (+h.slice(0,2)) * 60 + (+h.slice(3,5)); }

function semillaRutina(){
  const r = clon(DIAS_BASE);
  /* los ids arrancan iguales a los de antes para no perder los tildes ya puestos */
  r.forEach(d => (d.bloques || []).forEach((b, j) => { b.k = d.id + '-' + j; }));
  return r;
}

function ordenarDia(d){
  if(!d.bloques) return;
  d.bloques.sort((a, b) => (a.i ? aMin(a.i) : -1) - (b.i ? aMin(b.i) : -1));
}

function normalizarRutina(){
  if(!Array.isArray(db.rutina) || db.rutina.length !== 7) db.rutina = semillaRutina();
  db.rutina.forEach(d => {
    if(d.flex){
      if(!Array.isArray(d.metas)) d.metas = [];
      d.metas.forEach(mt => {
        if(!Array.isArray(mt.tareas)) mt.tareas = [];
        mt.min = Math.max(15, +mt.min || 60);
      });
    } else {
      if(!Array.isArray(d.bloques)) d.bloques = [];
      d.bloques.forEach(b => { if(!b.k) b.k = nuevoId(d.id); });
      ordenarDia(d);
    }
  });
  DIAS = db.rutina;
  if(!db.notas) db.notas = {};
  if(!Array.isArray(db.pend)) db.pend = [];
  if(!db.controles) db.controles = {};
  Object.keys(db.controles).forEach(k => (db.controles[k]||[]).forEach(c => {
    if(!c.id) c.id = 'c' + Math.random().toString(36).slice(2,7);
  }));
}
normalizarRutina();

function claveSemana(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dw = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dw);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const w = Math.ceil(((t - y0) / 864e5 + 1) / 7);
  return t.getUTCFullYear() + '-S' + String(w).padStart(2, '0');
}
const HOY = new Date();
const SK = claveSemana(HOY);
function sem(k){
  k = k || SK;
  if(!db.semanas[k]) db.semanas[k] = {check:{}, min:{}};
  if(!db.semanas[k].check) db.semanas[k].check = {};
  if(!db.semanas[k].min)   db.semanas[k].min   = {};
  return db.semanas[k];
}


/* =========================================================
   2b. SINCRONIZACIÓN AUTOMÁTICA  ·  celu <-> compu
   Pegá acá la URL de tu base de Firebase y listo.
   Si lo dejás vacío, funciona igual pero solo en este dispositivo.
   ========================================================= */
const SYNC = {
  url:   'https://planificacion-academica-fcea-default-rtdb.firebaseio.com',
  clave: 'fcea-zg9xc3upph'   // tu clave secreta: no la compartas ni la cambies
};

let estadoSync = SYNC.url ? 'esperando' : 'local';
let timerSubida = null;

function pintarEstado(){
  const el = document.getElementById('sync-luz');
  if(!el) return;
  const txt = {local:'', esperando:'⏳', ok:'☁️', error:'⚠️'};
  el.textContent = txt[estadoSync] || '';
  el.title = {local:'Guardado solo en este dispositivo', esperando:'Sincronizando…',
              ok:'Sincronizado', error:'No se pudo conectar'}[estadoSync] || '';
}

function nodo(){ return SYNC.url.replace(/\/$/,'') + '/planner/' + SYNC.clave + '.json'; }

function subirPronto(){
  if(!SYNC.url) return;
  clearTimeout(timerSubida);
  timerSubida = setTimeout(subir, 1200);
}
function subir(){
  if(!SYNC.url) return;
  estadoSync = 'esperando'; pintarEstado();
  fetch(nodo(), {method:'PUT', body: JSON.stringify(db)})
    .then(r => { estadoSync = r.ok ? 'ok' : 'error'; pintarEstado(); })
    .catch(() => { estadoSync = 'error'; pintarEstado(); });
}
function bajar(primera){
  if(!SYNC.url) return;
  if(typeof hojaCtx !== 'undefined' && hojaCtx) return;   // no pisar nada mientras estás editando
  fetch(nodo())
    .then(r => r.json())
    .then(remoto => {
      estadoSync = 'ok';
      if(remoto && remoto.semanas){
        if((remoto.ts||0) > (db.ts||0)){
          db = Object.assign({}, DB_BASE, remoto);
          normalizarRutina();
          rawSet(KEY, JSON.stringify(db));
          if(!hojaCtx) pintar();
        } else if(primera && (db.ts||0) > (remoto.ts||0)){
          subir();
        }
      } else if(primera){ subir(); }
      pintarEstado();
    })
    .catch(() => { estadoSync = 'error'; pintarEstado(); });
}

/* =========================================================
   3. HELPERS
   ========================================================= */
const $  = s => document.querySelector(s);
const idxHoy = (HOY.getDay() + 6) % 7;           // 0 = lunes
const mins = h => { const p = h.split(':'); return +p[0]*60 + +p[1]; };
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const dur  = b => (b.i && b.f) ? mins(b.f) - mins(b.i) : 30;
const hs   = m => m < 60 ? m + "'" : (m % 60 === 0 ? (m/60) + ' h' : Math.floor(m/60) + ' h ' + (m%60) + "'");
const esc  = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bid  = (d,j,b) => (b && b.k) ? b.k : d.id + '-' + j;

/* nombre / ícono / color de un bloque o meta (puede ser una materia o algo escrito por vos) */
const PALETA = [['#FF8FB8','Rosa'],['#B196EE','Lavanda'],['#6FD3B7','Menta'],
                ['#F5B75C','Miel'],['#7FB4F0','Celeste'],['#CE9AEA','Lila'],['#9FB3C8','Gris']];
function matB(x){
  if(x && x.nm) return {n:x.nm, e:x.e || '📌', c:x.c || '#BCAEDC'};
  return MAT[x && x.m] || {n:'Otra cosa', e:'📌', c:'#BCAEDC'};
}

function ahoraMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }

function metaMin(dia, m){ return sem().min[dia.id + '-' + m] || 0; }
function setMeta(dia, m, v){ sem().min[dia.id + '-' + m] = Math.max(0, v); save(); }

/* minutos planificados y hechos por materia en la semana */
function balance(k){
  const s = sem(k), plan = {}, hecho = {};
  DIAS.forEach(d => {
    if(d.flex){
      d.metas.forEach(mt => {
        plan[mt.m] = (plan[mt.m]||0) + mt.min;
        hecho[mt.m] = (hecho[mt.m]||0) + Math.min(s.min[d.id+'-'+mt.m]||0, mt.min);
      });
    } else {
      d.bloques.forEach((b,j) => {
        if(b.pausa) return;
        const mk = b.m || 'otro';
        plan[mk] = (plan[mk]||0) + dur(b);
        if(s.check[bid(d,j,b)]) hecho[mk] = (hecho[mk]||0) + dur(b);
      });
    }
  });
  return {plan, hecho};
}
function porcentaje(k){
  const {plan, hecho} = balance(k);
  const p = Object.values(plan).reduce((a,b)=>a+b,0);
  const h = Object.values(hecho).reduce((a,b)=>a+b,0);
  return p ? Math.round(h/p*100) : 0;
}
function diaCompleto(d){
  const s = sem();
  if(d.flex) return d.metas.every(mt => (s.min[d.id+'-'+mt.m]||0) >= mt.min);
  if(!d.bloques.length) return false;
  return d.bloques.every((b,j) => b.pausa || s.check[bid(d,j,b)]);
}

/* =========================================================
   4. VISTA · HOY
   ========================================================= */
function bloqueActual(){
  const d = DIAS[idxHoy];
  if(d.flex) return null;
  const a = ahoraMin();
  for(let j=0;j<d.bloques.length;j++){
    const b = d.bloques[j];
    if(b.pausa) continue;
    if(b.i && a >= mins(b.i) && a < mins(b.f)) return {b, j, estado:'ahora'};
  }
  for(let j=0;j<d.bloques.length;j++){
    const b = d.bloques[j];
    if(!b.pausa && b.i && a < mins(b.i)) return {b, j, estado:'proximo'};
  }
  return null;
}

function renderHoy(){
  const d = DIAS[idxHoy];
  const act = bloqueActual();
  let hero;
  if(act){
    const m = matB(act.b);
    const a = ahoraMin();
    if(act.estado === 'ahora'){
      const pct = Math.round((a - mins(act.b.i)) / dur(act.b) * 100);
      hero = `<div class="now">
        <div class="eyebrow">Ahora mismo</div>
        <h2>${m.e} ${esc(m.n)}</h2>
        <p>${esc(act.b.t)} · hasta las ${act.b.f} (te quedan ${hs(mins(act.b.f)-a)})</p>
        <div class="barra"><i style="width:${pct}%"></i></div>
      </div>`;
    } else {
      hero = `<div class="now">
        <div class="eyebrow">Lo que viene</div>
        <h2>${m.e} ${esc(m.n)}</h2>
        <p>${act.b.i} · ${esc(act.b.t)} · arranca en ${hs(mins(act.b.i)-a)}</p>
      </div>`;
    }
  } else {
    const pend = d.flex
      ? d.metas.filter(mt => metaMin(d,mt.m) < mt.min).map(mt => matB(mt).n).join(' y ')
      : '';
    hero = `<div class="now">
      <div class="eyebrow">${d.e} ${esc(d.n)}</div>
      <h2>${d.flex ? (pend ? 'Te falta ' + esc(pend) : '¡Todo hecho! 🎀') : 'Día cerrado 🌙'}</h2>
      <p>${d.flex ? esc(d.foco) : 'No quedan bloques con horario por hoy'}</p>
    </div>`;
  }
  const urg = pendUrgentes();
  const alerta = urg.length
    ? `<div class="alerta"><i>⏰</i><span>${urg.map(p => {
        const dd = dias(p.f);
        return esc(p.t) + ' · ' + (dd < 0 ? 'venció' : (dd === 0 ? 'es hoy' : (dd === 1 ? 'es mañana' : 'en 2 días')));
      }).join(' · ')}</span></div>`
    : '';
  $('#v-hoy').innerHTML = (editando ? AVISO : '') + alerta + hero +
    `<div class="card">${cardDia(d, true)}</div>` + cardPendientes();
}

/* =========================================================
   5. TARJETA DE UN DÍA (riel o metas)
   ========================================================= */
function cardDia(d, solo){
  const completo = diaCompleto(d);
  let h = `<div class="dia-head">
      <h3>${d.e} ${esc(d.n)}</h3>
      ${editando ? `<button class="lapiz" data-dedit="${d.id}" title="Editar el día">✏️</button>` : ''}
      <span class="pill ${completo?'full':''}">${completo ? '¡completo! ✨' : (d.flex ? 'a tu ritmo' : 'con horario')}</span>
    </div>
    ${d.foco ? `<p class="foco">Foco: <b>${esc(d.foco)}</b></p>` : '<p class="foco"></p>'}`;

  if(d.flex){
    d.metas.forEach((mt, j) => {
      const m = matB(mt), hechos = metaMin(d, mt.m);
      const pct = Math.min(100, Math.round(hechos/mt.min*100));
      h += `<div class="meta" style="border-left-color:${m.c}">
        <div class="mtop">
          <b>${m.e} ${esc(m.n)}</b>
          <span class="val" style="color:${m.c}">${hs(hechos)} / ${hs(mt.min)}</span>
        </div>
        <div class="bar"><i style="width:${pct}%;background:${m.c}"></i></div>
        <div class="plusminus">
          <button data-meta="${d.id}|${mt.m}|-30">−30'</button>
          <button data-meta="${d.id}|${mt.m}|30">+30'</button>
          <button data-meta="${d.id}|${mt.m}|60">+1 h</button>
          <button data-meta="${d.id}|${mt.m}|0">reset</button>
        </div>
        ${mt.tareas.length ? '<ul>' + mt.tareas.map(t=>`<li>${esc(t)}</li>`).join('') + '</ul>' : ''}
        ${mt.nota ? `<span class="nota-lin">📝 ${esc(mt.nota)}</span>` : ''}
        ${editando ? `<div class="plusminus" style="margin-top:9px">
            <button data-medit="${d.id}|${j}">✏️ Editar</button>
            <button data-mdel="${d.id}|${j}">🗑️ Borrar</button>
          </div>` : ''}
        ${mt.checklist ? mt.checklist.map((t,k)=>{
          const on = sem().check[d.id+'-rev-'+k];
          return `<button class="mini-check ${on?'done':''}" data-rev="${d.id}-rev-${k}">
                    <span class="tick">✓</span><span>${esc(t)}</span></button>`;
        }).join('') : ''}
      </div>`;
    });
    if(!d.metas.length) h += '<p class="vacio">Sin metas todavía</p>';
    if(d.nota) h += `<p class="foco" style="margin:2px 0 0">${esc(d.nota)}</p>`;
    if(editando) h += `<button class="btn mini" data-madd="${d.id}">＋ Agregar meta</button>`;
    return h;
  }

  h += '<div class="riel">';
  let prevFin = null;
  d.bloques.forEach((b, j) => {
    if(b.i && prevFin !== null && mins(b.i) - prevFin >= 60){
      h += `<div class="hueco">· · · ${hs(mins(b.i)-prevFin)} · · ·</div>`;
    }
    if(b.pausa){
      h += `<div class="hueco" style="height:auto;padding:3px 0;gap:6px">☕ ${b.i||''} · ${esc(b.t)}
        ${editando ? `<button class="lapiz" data-bedit="${d.id}|${j}">✏️</button>
                      <button class="lapiz" data-bdel="${d.id}|${j}">🗑️</button>` : ''}</div>`;
      if(b.f) prevFin = mins(b.f);
      return;
    }
    const m = matB(b), on = sem().check[bid(d,j,b)];
    const esHoy = (DIAS[idxHoy].id === d.id);
    const act = esHoy && b.i && ahoraMin() >= mins(b.i) && ahoraMin() < mins(b.f);
    h += `<div class="bloque ${on?'done':''} ${act?'ahora':''}" role="button" tabindex="0"
            data-b="${bid(d,j,b)}" data-bj="${d.id}|${j}" style="border-left-color:${m.c}">
      <span class="hora">${b.i ? b.i : 'antes'}${b.f ? '<small>'+b.f+'</small>' : '<small>19:00</small>'}</span>
      <span class="tick">✓</span>
      <span class="tx">
        <b>${m.e} ${esc(m.n)}</b>
        <span>${esc(b.t)}${b.d ? ' · ' + esc(b.d) : ''}</span>
        ${b.nota ? `<span class="nota-lin">📝 ${esc(b.nota)}</span>` : ''}
      </span>
      ${act ? '<span class="flag">ahora</span>' : ''}
      ${editando
          ? `<button class="bq-ico on" data-bdel="${d.id}|${j}" title="Borrar">🗑️</button>`
          : `<button class="bq-ico ${b.nota?'on':''}" data-nota="${d.id}|${j}" title="Nota">📝</button>`}
    </div>`;
    if(b.f) prevFin = mins(b.f);
  });
  if(!d.bloques.length) h += '<p class="vacio">Este día está vacío</p>';
  h += '</div>';
  if(editando) h += `<button class="btn mini" data-badd="${d.id}">＋ Agregar bloque</button>`;
  return h;
}

/* =========================================================
   7. VISTA · MATERIAS (temario + revisión)
   ========================================================= */
const CURSANDO = Object.keys(MAT).filter(k => MAT[k].prio).sort((a,b) => MAT[a].prio - MAT[b].prio);
const MEDALLA = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣'];
let abierta = null, abiertaF = null, abiertaN = null, diaSel = null;

function rev(k){
  if(typeof db.revision[k] === 'string') db.revision[k] = {r1:db.revision[k], r2:''};
  if(!db.revision[k]) db.revision[k] = {r1:'', r2:''};
  return db.revision[k];
}
function ctrls(k){
  if(!db.controles[k]) db.controles[k] = [];
  db.controles[k].forEach(c => { if(!c.id) c.id = 'c' + Math.random().toString(36).slice(2,7); });
  return db.controles[k];
}
function unis(k){  if(!db.temario[k])   db.temario[k]   = []; return db.temario[k]; }
function dias(f){  return f ? Math.ceil((new Date(f + 'T12:00') - HOY) / 864e5) : null; }
function fmt(f){   const d = new Date(f + 'T12:00'); return d.getDate() + '/' + (d.getMonth()+1); }
function cuando(d){
  if(d === null) return '';
  if(d < 0)  return 'ya pasó';
  if(d === 0) return '¡es hoy!';
  if(d === 1) return 'mañana';
  return 'en ' + d + ' días';
}
function claseUrgencia(d){ return d <= 7 ? 'mal' : (d <= 21 ? 'ojo' : 'bien'); }

/* todas las fechas del semestre, ordenadas */
function agenda(){
  const out = [];
  CURSANDO.forEach(k => {
    const r = rev(k);
    if(r.r1) out.push({k, t:'Revisión 1', f:r.r1, d:dias(r.r1)});
    if(r.r2) out.push({k, t:'Revisión 2', f:r.r2, d:dias(r.r2)});
    ctrls(k).forEach(c => { if(!c.ok && c.f) out.push({k, t:c.t || 'Control', f:c.f, d:dias(c.f), ctrl:true}); });
    ((db.notas[k]||{}).extra || []).forEach(x => { if(x.f) out.push({k, t:x.n || 'Trabajo', f:x.f, d:dias(x.f)}); });
  });
  return out.filter(x => x.d >= 0).sort((a,b) => a.d - b.d);
}

/* un bloque de revisión con su temario */
function bloqueRev(k, rn){
  const m = MAT[k], r = rev(k), f = r['r'+rn];
  const lista = unis(k).map((u,j) => ({u,j})).filter(x => (x.u.r||1) === rn);
  const listas = lista.filter(x => x.u.ok).length;
  const pct = lista.length ? Math.round(listas/lista.length*100) : 0;
  const d = dias(f);
  const faltan = lista.length - listas;

  let chip = '<span class="cuenta">sin fecha</span>', ritmo = '';
  if(f){
    if(d < 0) chip = '<span class="cuenta">ya pasó</span>';
    else {
      const semanas = Math.max(1, Math.ceil(d/7));
      const porSem = faltan / semanas;
      const cl = faltan === 0 ? 'bien' : (porSem <= 1.5 ? 'bien' : (porSem <= 3 ? 'ojo' : 'mal'));
      chip = `<span class="cuenta ${cl}">${cuando(d)}</span>`;
      ritmo = faltan === 0
        ? '<b style="color:var(--menta)">temario terminado ✨</b>'
        : (lista.length ? `necesitás <b>${porSem.toFixed(1)} unidades por semana</b>` : '');
    }
  }

  return `<div class="rev-box">
    <div class="rev-top">
      <b>${rn === 1 ? '🍂 Revisión 1' : '🎄 Revisión 2'}</b>
      <input type="date" value="${f||''}" data-rev-fecha="${k}|r${rn}">
      ${chip}
    </div>
    ${lista.length ? `<div class="bar"><i style="width:${pct}%;background:${m.c}"></i></div>
      <p class="foco" style="margin:7px 0 6px">${listas}/${lista.length} unidades · ${pct}%${ritmo ? ' · ' + ritmo : ''}</p>` : ''}
    ${lista.length
      ? lista.map(x => `<div class="uni ${x.u.ok?'done':''}">
          <button class="tick" data-uni="${k}|${x.j}">✓</button>
          <button class="nm" data-uni="${k}|${x.j}">${esc(x.u.t)}</button>
          <button class="del" data-uedit="${k}|${x.j}" title="Editar">✎</button>
          <button class="del" data-del="${k}|${x.j}" title="Borrar">×</button>
        </div>`).join('')
      : '<p class="vacio">Sin unidades cargadas todavía 🌷</p>'}
    <div class="add-row">
      <input placeholder="Unidad · tema" data-add="${k}|${rn}">
      <button data-addbtn="${k}|${rn}">Agregar</button>
    </div>
  </div>`;
}

/* controles de una materia */
function bloqueCtrl(k){
  const cs = ctrls(k);
  return `<div class="rev-box">
    <div class="rev-top"><b>📝 Controles del semestre</b></div>
    ${cs.length
      ? cs.map((c,j) => {
          const d = dias(c.f);
          return `<div class="uni ${c.ok?'done':''}">
            <button class="tick" data-ctrl="${k}|${j}">✓</button>
            <button class="nm" data-ctrl="${k}|${j}">${esc(c.t)}
              <em style="font-style:normal;color:var(--soft);font-weight:600">
                ${c.f ? ' · ' + fmt(c.f) + (c.h ? ' ' + c.h : '') + (c.ok ? '' : ' · ' + cuando(d)) : ''}
                ${c.lugar ? ' · ' + (LUGARES[c.lugar]||'') : ''}
              </em>
              ${c.temas ? '<em style="font-style:normal;display:block;color:var(--lav);font-weight:700;font-size:11.5px">' + esc(c.temas) + '</em>' : ''}
            </button>
            <button class="del" data-iedit="${k}|c-${c.id}" title="Editar">✎</button>
            <button class="del" data-cdel="${k}|${j}" title="Borrar">×</button>
          </div>`;
        }).join('')
      : '<p class="vacio">Todavía no cargaste controles</p>'}
    <div class="add-row">
      <input placeholder="Control 1" data-cadd-t="${k}" style="flex:2">
      <input type="date" data-cadd-f="${k}" style="flex:1.2;min-width:120px">
      <button data-caddbtn="${k}">Sumar</button>
    </div>
  </div>`;
}

  const ag = agenda();

  let h = `<div class="card">

    ${ag.length
      ? '<div class="agenda">' + ag.slice(0,6).map(x => {
          const m = MAT[x.k];
          return `<div class="ag-item">
            <span class="ag-dot" style="background:${m.c}"></span>
            <b>${m.e} ${esc(m.n)}</b>
            <span class="muted">${esc(x.t)}</span>

          </div>`;
        }).join('') + '</div>'
      : '<p class="foco" style="margin:6px 0 0">Cargá las fechas de las revisiones y de los controles y te van a aparecer acá, ordenadas por cercanía.</p>'}
  </div>`;

  h += '<div class="acordeon">' + CURSANDO.map(k => {
    const m = MAT[k];
    const t = unis(k);
    const listas = t.filter(u => u.ok).length;

    const prox = ag.filter(x => x.k === k)[0];
    const open = abierta === k;
    return `<div class="card mat ${open?'open':''}">
      <button class="mat-head" data-acc="${k}">
        <span class="rank" style="background:${m.c}33;color:${m.c}">${MEDALLA[m.prio-1]}</span>
        <span class="mat-tx">
          <b>${m.e} ${esc(m.n)}</b>
          <span class="muted">${t.length ? listas + '/' + t.length + ' unidades · ' + pct + '%' : 'sin temario'}${prox ? ' · ' + esc(prox.t) + ' ' + cuando(prox.d) : ''}</span>
        </span>
        <span class="hrs">${plan[k] ? hs(plan[k]) : '—'}<br><span class="muted">semanal</span></span>

      ${open ? `<div class="mat-body">${bloqueRev(k,1)}${bloqueRev(k,2)}${bloqueCtrl(k)}</div>` : ''}
    </div>`;
  }).join('') + '</div>';

  $('#v-materias').innerHTML = h;
}

      <button class="btn ghost" id="b-rutina">Volver a la rutina original</button>

  $('#v-progreso').innerHTML = h;

function optsMat(sel){
  return Object.keys(MAT).map(k =>
      `<option value="${k}" ${k===sel?'selected':''}>${MAT[k].e} ${esc(MAT[k].n)}</option>`).join('')
    + `<option value="otro" ${sel==='otro'?'selected':''}>📌 Otra cosa (la escribís vos)</option>`;
}
function optsColor(sel){
  return PALETA.map(([c,n]) => `<option value="${c}" ${c===sel?'selected':''}>${n}</option>`).join('');
}
function campoOtro(x, visible){
  return `<div id="f-otro" class="${visible?'':'hidden'}">
    <div class="dos">
      <div class="campo" style="flex:0 0 86px"><label>Ícono</label>
        <input id="f-e" value="${esc((x&&x.e)||'📌')}" maxlength="4"></div>
      <div class="campo"><label>Nombre</label>
        <input id="f-nm" value="${esc((x&&x.nm)||'')}" placeholder="Ej: Gimnasio"></div>
    </div>
    <div class="campo"><label>Color</label>
      <select id="f-c">${optsColor((x&&x.c)||'#B196EE')}</select></div>
  </div>`;
}
function leerMat(destino){
  const k = $('#f-mat').value;
  if(k === 'otro'){
    destino.m  = 'otro';
    destino.nm = $('#f-nm').value.trim() || 'Otra cosa';
    destino.e  = $('#f-e').value.trim() || '📌';
    destino.c  = $('#f-c').value;
  } else {
    destino.m = k;
    delete destino.nm; delete destino.e; delete destino.c;
  }
}

/* ---------- bloque con horario ---------- */
function editarBloque(diaId, j){
  const d = dia(diaId); if(!d) return;
  const nuevo = j < 0;
  const b = nuevo ? {i:'19:00', f:'20:00', m:'gg1', t:'', d:'', nota:''} : d.bloques[j];
  if(!b) return;
  const tipo = b.pausa ? 'pausa' : (b.i ? 'hora' : 'libre');

  abrirHoja((nuevo ? 'Nuevo bloque · ' : 'Editar · ') + d.n, `
    <div class="campo"><label>Materia</label>
      <select id="f-mat">${optsMat(b.nm ? 'otro' : b.m)}</select></div>
    ${campoOtro(b, !!b.nm)}
    <div class="campo"><label>Tipo</label>
      <select id="f-tipo">
        <option value="hora"  ${tipo==='hora' ?'selected':''}>Con horario</option>
        <option value="libre" ${tipo==='libre'?'selected':''}>Sin hora fija</option>
        <option value="pausa" ${tipo==='pausa'?'selected':''}>Pausa / descanso</option>
      </select></div>
    <div class="dos ${tipo==='libre'?'hidden':''}" id="f-horas">
      <div class="campo"><label>Empieza</label><input type="time" id="f-i" value="${b.i||'19:00'}"></div>
      <div class="campo"><label>Termina</label><input type="time" id="f-f" value="${b.f||'20:00'}"></div>
    </div>
    <div class="campo"><label>Qué hacés</label>
      <input id="f-t" value="${esc(b.t||'')}" placeholder="Ej: Clase"></div>
    <div class="campo"><label>Detalle (opcional)</label>
      <input id="f-d" value="${esc(b.d||'')}" placeholder="Ej: Resumen en paralelo"></div>
    <div class="campo"><label>Nota (opcional)</label>
      <textarea id="f-nota" placeholder="Lo que quieras acordarte">${esc(b.nota||'')}</textarea></div>
  `, {
    ok(){
      const tp = $('#f-tipo').value;
      const nb = {k: nuevo ? nuevoId(d.id) : b.k};
      leerMat(nb);
      if(tp === 'pausa'){ nb.pausa = true; nb.m = 'margen'; }
      if(tp === 'libre'){ nb.libre = true; }
      if(tp !== 'libre'){
        const i = $('#f-i').value, f = $('#f-f').value;
        if(!i || !f){ alert('Poné hora de inicio y de fin.'); return false; }
        if(mins(f) <= mins(i)){ alert('La hora de fin tiene que ser más tarde que la de inicio.'); return false; }
        nb.i = i; nb.f = f;
      }
      nb.t    = $('#f-t').value.trim() || (tp === 'pausa' ? 'Descanso' : 'Estudiar');
      nb.d    = $('#f-d').value.trim();
      nb.nota = $('#f-nota').value.trim();
      if(nuevo) d.bloques.push(nb); else d.bloques[j] = nb;
      guardarRutina(d);
    }
  });
}

/* ---------- meta de día flexible ---------- */
function editarMeta(diaId, j){
  const d = dia(diaId); if(!d) return;
  const nuevo = j < 0;
  const mt = nuevo ? {m:'gg1', min:60, tareas:[]} : d.metas[j];
  if(!mt) return;
  abrirHoja((nuevo ? 'Nueva meta · ' : 'Editar meta · ') + d.n, `
    <div class="campo"><label>Materia</label>
      <select id="f-mat">${optsMat(mt.nm ? 'otro' : mt.m)}</select></div>
    ${campoOtro(mt, !!mt.nm)}
    <div class="campo"><label>Minutos que querés hacer</label>
      <input type="number" id="f-min" min="15" step="15" value="${+mt.min || 60}"></div>
    <div class="campo"><label>Tareas (una por línea)</label>
      <textarea id="f-tareas" placeholder="Continuar el manual&#10;Resolver ejercicios">${esc((mt.tareas||[]).join('\n'))}</textarea></div>
    <div class="campo"><label>Checklist con tildes (una por línea, opcional)</label>
      <textarea id="f-check" placeholder="Ver qué quedó pendiente">${esc((mt.checklist||[]).join('\n'))}</textarea></div>
    <div class="campo"><label>Nota (opcional)</label>
      <textarea id="f-nota">${esc(mt.nota||'')}</textarea></div>
  `, {
    ok(){
      const nm = {};
      leerMat(nm);
      const choque = d.metas.some((o, k) => k !== j && (o.m || '') === nm.m && (o.nm || '') === (nm.nm || ''));
      if(choque){ alert('Ya hay una meta de esa materia en este día. Cambiale los minutos a la que ya está.'); return false; }
      nm.min = Math.max(15, +$('#f-min').value || 60);
      nm.tareas = $('#f-tareas').value.split('\n').map(x => x.trim()).filter(Boolean);
      const ch = $('#f-check').value.split('\n').map(x => x.trim()).filter(Boolean);
      if(ch.length) nm.checklist = ch;
      nm.nota = $('#f-nota').value.trim();
      if(nuevo) d.metas.push(nm); else d.metas[j] = nm;
      guardarRutina(null);
    }
  });
}

/* =========================================================
   10. EVALUACIONES, FECHAS Y PENDIENTES
   ========================================================= */
const LUGARES = {'':'—', mvd:'Montevideo', tbo:'Tacuarembó', virt:'Virtual', otro:'Otro lugar'};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','M','J','V','S','D'];

function nota(k){
  if(!db.notas[k]) db.notas[k] = {};
  const n = db.notas[k];
  if(!n.it) n.it = {};
  if(!Array.isArray(n.extra)) n.extra = [];
  if(n.tope == null) n.tope = 100;
  if(n.meta == null) n.meta = 50;
  if(n.cred == null) n.cred = 0;
  return n;
}
function cfgIt(k, id){
  const n = nota(k);
  if(!n.it[id]) n.it[id] = {max:null, min:null, nota:null};
  return n.it[id];
}
const numOn = v => (v !== null && v !== undefined && v !== '' && !isNaN(+v));

/* todas las instancias evaluatorias de una materia, unificadas */
function instancias(k){
  const r = rev(k), n = nota(k), out = [];
  [1,2].forEach(i => out.push({
    id:'r'+i, k, tipo:'rev', n:'Revisión ' + i, emo: i===1 ? '🍂' : '🎄',
    f:r['r'+i]||'', h:r['h'+i]||'', lugar:r['l'+i]||'', temas:'',
    cfg:cfgIt(k, 'r'+i)
  }));
  ctrls(k).forEach((c,j) => out.push({
    id:'c-'+c.id, k, tipo:'ctrl', n:c.t || 'Control', emo:'📝', j,
    f:c.f||'', h:c.h||'', lugar:c.lugar||'', temas:c.temas||'', ok:c.ok,
    cfg:cfgIt(k, 'c-'+c.id), ref:c
  }));
  n.extra.forEach((x,j) => out.push({
    id:'x-'+x.id, k, tipo:'extra', n:x.n || 'Trabajo', emo:'📦', j,
    f:x.f||'', h:x.h||'', lugar:x.lugar||'', temas:x.temas||'',
    cfg:cfgIt(k, 'x-'+x.id), ref:x
  }));
  return out;
}

/* cuánto llevás, hasta dónde podés llegar */
function cuenta(k){
  const n = nota(k), its = instancias(k);
  let sum = 0, posible = 0, maxRendido = 0, cargadas = 0, conMax = 0;
  const bajoMin = [];
  its.forEach(x => {
    const c = x.cfg, mx = numOn(c.max) ? +c.max : 0;
    if(mx > 0) { posible += mx; conMax++; }
    if(numOn(c.nota)){
      cargadas++;
      sum += +c.nota;
      maxRendido += mx;
      if(numOn(c.min) && +c.nota < +c.min) bajoMin.push(x.n);
    }
  });
  const techo = sum + Math.max(0, posible - maxRendido);
  return {sum, posible, techo, bajoMin, cargadas, conMax,
          meta:+n.meta, tope:+n.tope, cred:+n.cred};
}
function veredicto(k){
  const c = cuenta(k);
  if(!c.conMax) return {cl:'qz', txt:'Cargá los puntajes máximos de cada instancia y te digo cómo venís.'};
  if(c.bajoMin.length)
    return {cl:'no', txt:'Quedaste por debajo del mínimo en ' + c.bajoMin.join(' y ') +
      '. Con ' + c.sum + ' de ' + c.tope + ' puntos, revisá qué te habilita el reglamento.'};
  if(!c.cargadas) return {cl:'qz', txt:'Todavía no cargaste ninguna nota. Necesitás ' + c.meta +
      ' de ' + c.tope + ' puntos para ganar el curso.'};
  if(c.sum >= c.meta)
    return {cl:'si', txt:'¡Curso ganado! Llevás ' + c.sum + ' puntos y necesitabas ' + c.meta +
      '.' + (c.cred ? ' Son ' + c.cred + ' créditos. 🎀' : '')};
  if(c.techo < c.meta)
    return {cl:'no', txt:'Con lo que queda por rendir llegás como máximo a ' + c.techo +
      ' y necesitás ' + c.meta + '. El curso no da, pero podés ir a examen.'};
  return {cl:'qz', txt:'Llevás ' + c.sum + ' puntos. Te faltan ' + (c.meta - c.sum) +
    ' para ganar el curso y todavía hay ' + (c.techo - c.sum) + ' en juego.'};
}

/* ---------- pendientes ---------- */
function pendActivos(){ return db.pend.filter(p => !p.ok); }
function pendUrgentes(){
  return pendActivos().filter(p => p.f && dias(p.f) !== null && dias(p.f) <= 2)
                      .sort((a,b) => dias(a.f) - dias(b.f));
}

/* ---------- agenda completa para el calendario ---------- */
function eventos(){
  const out = [];
  CURSANDO.forEach(k => instancias(k).forEach(x => {
    if(x.f) out.push({f:x.f, c:MAT[k].c, k, tipo:x.tipo, t:x.n, x});
  }));
  db.pend.forEach(p => { if(p.f && !p.ok) out.push({f:p.f, c:'#B196EE', tipo:'pend', t:p.t, p}); });
  return out;
}

/* =========================================================
   11. VISTA: FECHAS
   ========================================================= */
let mesVis = new Date(HOY.getFullYear(), HOY.getMonth(), 1);

function calendario(){
  const ev = eventos();
  const y = mesVis.getFullYear(), m = mesVis.getMonth();
  const primero = new Date(y, m, 1);
  const arranque = (primero.getDay() + 6) % 7;          /* lunes = 0 */
  const total = new Date(y, m + 1, 0).getDate();
  const iso = d => y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  const hoyIso = HOY.getFullYear() + '-' + String(HOY.getMonth()+1).padStart(2,'0') +
                 '-' + String(HOY.getDate()).padStart(2,'0');

  let c = '<div class="cal">' + DOW.map(d => '<span class="dow">' + d + '</span>').join('');
  for(let i = 0; i < arranque; i++) c += '<button class="cal-d off"></button>';
  for(let d = 1; d <= total; d++){
    const f = iso(d);
    const cols = [...new Set(ev.filter(e => e.f === f).map(e => e.c))].slice(0,4);
    c += `<button class="cal-d ${f === hoyIso ? 'hoy' : ''}" data-cald="${f}">
      <span>${d}</span>
      <span class="cal-pts">${cols.map(x => `<i style="background:${f===hoyIso?'#fff':x}"></i>`).join('')}</span>
    </button>`;
  }
  c += '</div>';

  return `<div class="card">
    <div class="cal-head">
      <button class="cal-nav" data-mes="-1">‹</button>
      <b>${MESES[m]} ${y}</b>
      <button class="cal-nav" data-mes="1">›</button>
    </div>
    ${c}
    <p class="cal-nota">Los puntitos son revisiones, controles y entregas. Tocá un día para ver qué hay.</p>
  </div>`;
}

function filaInst(x, conMateria){
  const m = MAT[x.k], d = x.f ? dias(x.f) : null;
  const det = [];
  if(x.f) det.push(fmt(x.f) + (x.h ? ' · ' + x.h : ''));
  if(x.lugar) det.push(LUGARES[x.lugar] || x.lugar);
  if(!x.f) det.push('sin fecha');
  return `<div class="inst">
    <button class="ib" data-iedit="${x.k}|${x.id}">
      <b>${x.emo} ${conMateria ? m.e + ' ' + esc(m.n) + ' · ' : ''}${esc(x.n)}</b>
      <span>${det.join(' · ')}${x.temas ? ' · <em>' + esc(x.temas) + '</em>' : ''}</span>
    </button>
    ${x.lugar ? `<span class="chip ${x.lugar}">${(LUGARES[x.lugar]||'').split(' ')[0]}</span>` : ''}
    ${x.f && d !== null && d >= 0 ? `<span class="cuenta ${claseUrgencia(d)}">${cuando(d)}</span>` : ''}
  </div>`;
}

function renderFechas(){
  let h = calendario();

  if(diaSel){
    const ev = eventos().filter(e => e.f === diaSel);
    h += `<div class="card">
      <div class="eyebrow">${fmt(diaSel)}</div>
      ${ev.length
        ? ev.map(e => e.tipo === 'pend'
            ? `<div class="inst"><button class="ib"><b>📌 ${esc(e.t)}</b><span>Pendiente</span></button></div>`
            : filaInst(e.x, true)).join('')
        : '<p class="vacio">Ese día no tenés nada anotado 🌷</p>'}
    </div>`;
  }

  const todo = [];
  CURSANDO.forEach(k => instancias(k).forEach(x => { if(x.f) todo.push(x); }));
  const prox = todo.filter(x => dias(x.f) >= 0).sort((a,b) => a.f < b.f ? -1 : 1);
  const pas  = todo.filter(x => dias(x.f) < 0).sort((a,b) => a.f > b.f ? -1 : 1);

  h += `<div class="card">
    <div class="eyebrow">Lo que viene</div>
    ${prox.length ? prox.map(x => filaInst(x, true)).join('')
                  : '<p class="vacio">No hay fechas próximas cargadas</p>'}
  </div>`;

  h += '<div class="card"><div class="eyebrow">Por materia</div><div class="acordeon" style="margin-top:10px">' +
    CURSANDO.map(k => {
      const m = MAT[k], its = instancias(k);
      return `<div class="mat ${abiertaF === k ? 'open' : ''}">
        <button class="mat-top" data-accf="${k}">
          <span class="mat-ico" style="background:${m.c}22">${m.e}</span>
          <span class="mat-nm"><b>${esc(m.n)}</b><span>${its.filter(x=>x.f).length} con fecha · ${its.length} instancias</span></span>
          <span class="mat-hs">${abiertaF === k ? '▾' : '▸'}</span>
        </button>
        <div class="mat-body">
          ${its.map(x => filaInst(x, false)).join('')}
          <div class="btn-row" style="margin-top:8px">
            <button class="btn ghost mini" data-xadd="${k}">＋ Agregar trabajo o entrega</button>
          </div>
        </div>
      </div>`;
    }).join('') + '</div></div>';

  if(pas.length){
    h += `<div class="card"><div class="eyebrow">Ya pasaron</div>${
      pas.slice(0,8).map(x => filaInst(x, true)).join('')}</div>`;
  }

  $('#v-fechas').innerHTML = h;
}

/* =========================================================
   12. VISTA: NOTAS
   ========================================================= */
function renderNotas(){
  let ganados = 0, enJuego = 0, ganadas = [];
  CURSANDO.forEach(k => {
    const c = cuenta(k);
    if(c.cred){
      if(c.sum >= c.meta && c.conMax){ ganados += c.cred; ganadas.push(MAT[k].n); }
      else enJuego += c.cred;
    }
  });

  let h = `<div class="card">
    <div class="anillo">
      <div>
        <div class="eyebrow">Créditos ganados</div>
        <div class="num" style="color:var(--menta)">${ganados}</div>
      </div>
      <div style="flex:1">
        <p class="foco" style="margin:0">${
          ganadas.length
            ? 'Ya ganaste el curso de <b>' + ganadas.map(esc).join(', ') + '</b>.'
            : 'Todavía no cerraste ningún curso.'}${
          enJuego ? ' Hay <b>' + enJuego + ' créditos</b> más en juego este semestre.' : ''}</p>
      </div>
    </div>
  </div>`;

  h += '<div class="acordeon">' + CURSANDO.map(k => {
    const m = MAT[k], n = nota(k), its = instancias(k), c = cuenta(k), v = veredicto(k);
    const pct = c.tope ? Math.min(100, Math.round(c.sum / c.tope * 100)) : 0;
    return `<div class="mat ${abiertaN === k ? 'open' : ''}">
      <button class="mat-top" data-accn="${k}">
        <span class="mat-ico" style="background:${m.c}22">${m.e}</span>
        <span class="mat-nm">
          <b>${esc(m.n)}</b>
          <span>${c.cargadas ? c.sum + ' / ' + c.tope + ' puntos' : 'sin notas cargadas'}${
            c.cred ? ' · ' + c.cred + ' créditos' : ''}</span>
        </span>
        <span class="mat-hs">${abiertaN === k ? '▾' : '▸'}</span>
      </button>
      <div class="mat-body">
        <div class="bar" style="margin-bottom:12px"><i style="width:${pct}%;background:${m.c}"></i></div>
        <div class="cfg-row">
          <div class="campo"><label>Créditos</label>
            <input type="number" min="0" step="1" value="${n.cred||''}" data-ncfg="${k}|cred"></div>
          <div class="campo"><label>Total</label>
            <input type="number" min="0" step="1" value="${n.tope}" data-ncfg="${k}|tope"></div>
          <div class="campo"><label>Para ganar</label>
            <input type="number" min="0" step="1" value="${n.meta}" data-ncfg="${k}|meta"></div>
        </div>
        <div class="nt-h"><span class="nm2">Instancia</span><span>Máx</span><span>Mín</span><span>Nota</span></div>
        ${its.map(x => `<div class="nt">
          <button class="nm2" data-iedit="${k}|${x.id}">${x.emo} ${esc(x.n)}
            <span>${x.f ? fmt(x.f) : 'sin fecha'}${x.lugar ? ' · ' + (LUGARES[x.lugar]||'') : ''}</span></button>
          <input type="number" min="0" step="1" value="${numOn(x.cfg.max)?x.cfg.max:''}" data-nt="${k}|${x.id}|max" placeholder="—">
          <input type="number" min="0" step="1" value="${numOn(x.cfg.min)?x.cfg.min:''}" data-nt="${k}|${x.id}|min" placeholder="—">
          <input type="number" min="0" step="1" class="n-nota" value="${numOn(x.cfg.nota)?x.cfg.nota:''}" data-nt="${k}|${x.id}|nota" placeholder="—">
        </div>`).join('')}
        <div class="btn-row" style="margin-top:10px">
          <button class="btn ghost mini" data-xadd="${k}">＋ Agregar trabajo o entrega</button>
        </div>
        <div class="veredicto ${v.cl}">${v.txt}</div>
        ${c.posible !== c.tope && c.conMax
          ? `<p class="foco" style="margin:8px 0 0">Ojo: los máximos que cargaste suman <b>${c.posible}</b>, no ${c.tope}.</p>`
          : ''}
      </div>
    </div>`;
  }).join('') + '</div>';

  h += `<div class="card">
    <div class="eyebrow">Cómo se calcula</div>
    <p class="foco" style="margin:6px 0 0">
      <b>Máx</b> es cuánto vale esa instancia · <b>Mín</b> es lo que necesitás para no quedar por el camino
      (dejalo vacío si no tiene) · <b>Nota</b> es lo que sacaste.
      El veredicto suma lo cargado y calcula hasta dónde podés llegar con lo que falta rendir.
    </p>
  </div>`;

  $('#v-notas').innerHTML = h;
}

/* =========================================================
   13. HOJAS DE EDICIÓN NUEVAS
   ========================================================= */
function optsLugar(sel){
  return Object.keys(LUGARES).map(k =>
    `<option value="${k}" ${k===sel?'selected':''}>${LUGARES[k]}</option>`).join('');
}

/* editar una instancia: fecha, hora, lugar, temas, nombre */
function editarInst(k, id){
  const x = instancias(k).find(i => i.id === id);
  if(!x) return;
  const esRev = x.tipo === 'rev';
  abrirHoja(MAT[k].n + ' · ' + x.n, `
    ${esRev ? '' : `<div class="campo"><label>Nombre</label>
      <input id="f-n" value="${esc(x.n)}" placeholder="Ej: Control 2"></div>`}
    <div class="dos">
      <div class="campo"><label>Fecha</label><input type="date" id="f-f" value="${x.f}"></div>
      <div class="campo"><label>Hora</label><input type="time" id="f-h" value="${x.h}"></div>
    </div>
    <div class="campo"><label>Dónde la rendís</label>
      <select id="f-l">${optsLugar(x.lugar)}</select></div>
    <div class="campo"><label>Temas que entran</label>
      <textarea id="f-tm" placeholder="Ej: UT 1 a UT 4">${esc(x.temas||'')}</textarea></div>
    ${x.tipo === 'ctrl' || x.tipo === 'extra'
      ? '<p class="pista">Para borrarla, usá la ✕ desde la solapa Materias.</p>' : ''}
  `, {
    ok(){
      const f = $('#f-f').value, hh = $('#f-h').value, l = $('#f-l').value, tm = $('#f-tm').value.trim();
      if(esRev){
        const r = rev(k), i = id.slice(1);
        r['r'+i] = f; r['h'+i] = hh; r['l'+i] = l;
      } else {
        const o = x.ref;
        if($('#f-n')) { const nn = $('#f-n').value.trim(); if(nn) (x.tipo === 'ctrl' ? o.t = nn : o.n = nn); }
        o.f = f; o.h = hh; o.lugar = l; o.temas = tm;
      }
      if(!esRev) x.ref.temas = tm; else nota(k).it[id].temas = tm;
      save(); pintar();
    }
  });
}

/* agregar un trabajo / entrega / parcial extra */
function agregarExtra(k){
  abrirHoja(MAT[k].n + ' · nueva instancia', `
    <div class="campo"><label>Nombre</label>
      <input id="f-n" placeholder="Ej: Trabajo obligatorio"></div>
    <div class="dos">
      <div class="campo"><label>Fecha de entrega</label><input type="date" id="f-f"></div>
      <div class="campo"><label>Hora</label><input type="time" id="f-h"></div>
    </div>
    <div class="campo"><label>Dónde</label><select id="f-l">${optsLugar('')}</select></div>
    <div class="dos">
      <div class="campo"><label>Puntaje máximo</label><input type="number" id="f-max" min="0" placeholder="Ej: 20"></div>
      <div class="campo"><label>Mínimo (opcional)</label><input type="number" id="f-min" min="0" placeholder="—"></div>
    </div>
    <div class="campo"><label>Temas / consigna</label><textarea id="f-tm"></textarea></div>
  `, {
    ok(){
      const nm = $('#f-n').value.trim();
      if(!nm){ alert('Ponele un nombre.'); return false; }
      const n = nota(k);
      const id = 'x' + Math.random().toString(36).slice(2,7);
      n.extra.push({id, n:nm, f:$('#f-f').value, h:$('#f-h').value,
                    lugar:$('#f-l').value, temas:$('#f-tm').value.trim()});
      n.it['x-'+id] = {
        max: $('#f-max').value === '' ? null : +$('#f-max').value,
        min: $('#f-min').value === '' ? null : +$('#f-min').value,
        nota: null
      };
      save(); pintar();
    }
  });
}

/* editar el nombre de una unidad del temario */
function editarUni(k, j){
  const u = unis(k)[j];
  if(!u) return;
  abrirHoja('Editar tema · ' + MAT[k].n, `
    <div class="campo"><label>Unidad · tema</label>
      <input id="f-t" value="${esc(u.t)}"></div>
    <div class="campo"><label>¿Para qué revisión entra?</label>
      <select id="f-r">
        <option value="1" ${(u.r||1)==1?'selected':''}>🍂 Revisión 1</option>
        <option value="2" ${(u.r||1)==2?'selected':''}>🎄 Revisión 2</option>
      </select></div>
  `, {
    ok(){
      const t = $('#f-t').value.trim();
      if(!t){ alert('El tema no puede quedar vacío.'); return false; }
      u.t = t; u.r = +$('#f-r').value;
      save(); pintar();
    }
  });
}

/* pendiente */
function editarPend(j){
  const nuevo = j < 0;
  const p = nuevo ? {t:'', f:'', ok:false} : db.pend[j];
  if(!p) return;
  abrirHoja(nuevo ? 'Nuevo pendiente' : 'Editar pendiente', `
    <div class="campo"><label>¿Qué te quedó pendiente?</label>
      <input id="f-t" value="${esc(p.t||'')}" placeholder="Ej: terminar el resumen de Eco"></div>
    <div class="campo"><label>Fecha de entrega (opcional)</label>
      <input type="date" id="f-f" value="${p.f||''}"></div>
    <div class="campo"><label>Detalle (opcional)</label>
      <textarea id="f-d">${esc(p.d||'')}</textarea></div>
  `, {
    ok(){
      const t = $('#f-t').value.trim();
      if(!t){ alert('Escribí qué es.'); return false; }
      p.t = t; p.f = $('#f-f').value; p.d = $('#f-d').value.trim();
      if(nuevo){ p.id = 'p' + Math.random().toString(36).slice(2,7); db.pend.push(p); }
      save(); pintar();
    }
  });
}

function cardPendientes(){
  const act = pendActivos();
  const hechos = db.pend.filter(p => p.ok);
  const orden = act.slice().sort((a,b) => {
    if(!a.f) return 1; if(!b.f) return -1;
    return a.f < b.f ? -1 : 1;
  });
  return `<div class="card">
    <div class="dia-head">
      <h3>📌 Pendientes</h3>
      <span class="pill ${act.length ? '' : 'full'}">${act.length ? act.length + ' abierto' + (act.length>1?'s':'') : 'al día ✨'}</span>
    </div>
    ${orden.length
      ? orden.map(p => {
          const j = db.pend.indexOf(p), d = p.f ? dias(p.f) : null;
          const det = [];
          if(p.f) det.push(fmt(p.f) + ' · ' + cuando(d));
          if(p.d) det.push(p.d);
          return `<div class="pd">
            <button class="tick" data-pok="${j}">✓</button>
            <button class="nm3" data-pedit="${j}">${esc(p.t)}
              ${det.length ? '<span>' + esc(det.join(' · ')) + '</span>' : ''}</button>
            ${p.f && d !== null ? `<span class="cuenta ${claseUrgencia(d)}">${d < 0 ? 'vencido' : cuando(d)}</span>` : ''}
            <button class="del" data-pdel="${j}">×</button>
          </div>`;
        }).join('')
      : '<p class="vacio">Nada pendiente por ahora 🌷</p>'}
    ${hechos.length
      ? `<p class="foco" style="margin:10px 0 0">${hechos.length} ya resuelto${hechos.length>1?'s':''} ·
         <button data-plimpiar="1" style="color:var(--lav);font-weight:800;background:none;padding:0">limpiar</button></p>`
      : ''}
    <div class="btn-row" style="margin-top:10px">
      <button class="btn ghost mini" data-padd="1">＋ Anotar algo pendiente</button>
    </div>
  </div>`;
}

/* =========================================================
   9. EVENTOS
   ========================================================= */
function pintar(){
  renderHoy(); renderSemana(); renderMaterias(); renderFechas(); renderNotas(); renderProgreso();
  const lun = new Date(HOY); lun.setDate(HOY.getDate() - idxHoy);
  const dom = new Date(lun);  dom.setDate(lun.getDate() + 6);
  const f = d => d.getDate() + '/' + (d.getMonth()+1);
  $('#rango').textContent = 'Semana del ' + f(lun) + ' al ' + f(dom) + ' · hiciste el ' + porcentaje() + '% de esta semana';
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-b],[data-meta],[data-rev],[data-uni],[data-del],[data-addbtn],[data-caddbtn],[data-ctrl],[data-cdel],[data-acc],[data-v],[data-nota],[data-bedit],[data-bdel],[data-badd],[data-dedit],[data-medit],[data-mdel],[data-madd],[data-hcerrar],[data-hok],[data-uedit],[data-iedit],[data-xadd],[data-accf],[data-accn],[data-cald],[data-mes],[data-padd],[data-pedit],[data-pok],[data-pdel],[data-plimpiar],#b-exp,#b-imp,#b-reset,#b-rutina,#btn-tema,#btn-edit');
  if(!t) return;

  /* --- fechas, notas y pendientes --- */
  if(t.dataset.uedit){ const [k,j] = t.dataset.uedit.split('|'); editarUni(k, +j); return; }
  if(t.dataset.iedit){ const [k,id] = t.dataset.iedit.split('|'); editarInst(k, id); return; }
  if(t.dataset.xadd){ agregarExtra(t.dataset.xadd); return; }
  if(t.dataset.accf){ abiertaF = (abiertaF === t.dataset.accf) ? null : t.dataset.accf; renderFechas(); return; }
  if(t.dataset.accn){ abiertaN = (abiertaN === t.dataset.accn) ? null : t.dataset.accn; renderNotas(); return; }
  if(t.dataset.cald){ diaSel = (diaSel === t.dataset.cald) ? null : t.dataset.cald; renderFechas(); return; }
  if(t.dataset.mes){
    mesVis = new Date(mesVis.getFullYear(), mesVis.getMonth() + (+t.dataset.mes), 1);
    diaSel = null; renderFechas(); return;
  }
  if(t.dataset.padd){ editarPend(-1); return; }
  if(t.dataset.pedit){ editarPend(+t.dataset.pedit); return; }
  if(t.dataset.pok){ const p = db.pend[+t.dataset.pok]; if(p){ p.ok = !p.ok; save(); pintar(); } return; }
  if(t.dataset.pdel){
    const p = db.pend[+t.dataset.pdel];
    if(p && confirm('¿Borrar "' + p.t + '"?')){ db.pend.splice(+t.dataset.pdel, 1); save(); pintar(); }
    return;
  }
  if(t.dataset.plimpiar){
    if(confirm('¿Borrar los pendientes ya resueltos?')){
      db.pend = db.pend.filter(p => !p.ok); save(); pintar();
    }
    return;
  }

  /* --- hoja de edición --- */
  if(t.dataset.hcerrar){ cerrarHoja(); return; }
  if(t.dataset.hok){
    if(hojaCtx && hojaCtx.ok() === false) return;
    cerrarHoja(); return;
  }
  if(t.id === 'btn-edit'){
    editando = !editando;
    t.classList.toggle('on', editando);
    document.body.classList.toggle('edit-on', editando);
    pintar(); return;
  }
  if(t.dataset.nota){ const [d0,j0] = t.dataset.nota.split('|'); editarNota(d0, +j0); return; }
  if(t.dataset.bedit){ const [d0,j0] = t.dataset.bedit.split('|'); editarBloque(d0, +j0); return; }
  if(t.dataset.badd){ editarBloque(t.dataset.badd, -1); return; }
  if(t.dataset.bdel){
    const [d0,j0] = t.dataset.bdel.split('|');
    const d = dia(d0); if(!d) return;
    const b = d.bloques[+j0];
    if(b && confirm('¿Borrar "' + (b.t || 'este bloque') + '" del ' + d.n + '?')){
      d.bloques.splice(+j0, 1); guardarRutina(null);
    }
    return;
  }
  if(t.dataset.dedit){ editarDia(t.dataset.dedit); return; }
  if(t.dataset.medit){ const [d0,j0] = t.dataset.medit.split('|'); editarMeta(d0, +j0); return; }
  if(t.dataset.madd){ editarMeta(t.dataset.madd, -1); return; }
  if(t.dataset.mdel){
    const [d0,j0] = t.dataset.mdel.split('|');
    const d = dia(d0); if(!d) return;
    const mt = d.metas[+j0];
    if(mt && confirm('¿Borrar la meta de ' + matB(mt).n + ' del ' + d.n + '?')){
      d.metas.splice(+j0, 1); guardarRutina(null);
    }
    return;
  }

  if(t.dataset.v){
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b === t));
    document.querySelectorAll('main section').forEach(sec =>
      sec.classList.toggle('hidden', sec.id !== 'v-' + t.dataset.v));
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  if(t.id === 'btn-tema'){
    const n = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
    document.documentElement.dataset.theme = n;
    t.textContent = n === 'night' ? '☀️' : '🌙';
    rawSet(KEY + '-tema', n);
    const mc = document.getElementById('meta-color');
    if(mc) mc.content = (n === 'night') ? '#241B33' : '#FFF7FB';
    return;
  }
  if(t.dataset.b){
    if(editando && t.dataset.bj){
      const [d0,j0] = t.dataset.bj.split('|'); editarBloque(d0, +j0); return;
    }
    const s = sem(); s.check[t.dataset.b] = !s.check[t.dataset.b]; save(); pintar(); return;
  }
  if(t.dataset.rev){
    const s = sem(); s.check[t.dataset.rev] = !s.check[t.dataset.rev]; save(); pintar(); return;
  }
  if(t.dataset.meta){
    const [dia, m, delta] = t.dataset.meta.split('|');
    const d = DIAS.find(x => x.id === dia);
    setMeta(d, m, +delta === 0 ? 0 : metaMin(d, m) + (+delta));
    pintar(); return;
  }
  if(t.dataset.uni){
    const [k, j] = t.dataset.uni.split('|');
    db.temario[k][+j].ok = !db.temario[k][+j].ok; save(); renderMaterias(); return;
  }
  if(t.dataset.del){
    const [k, j] = t.dataset.del.split('|');
    db.temario[k].splice(+j, 1); save(); renderMaterias(); return;
  }
  if(t.dataset.acc){
    abierta = (abierta === t.dataset.acc) ? null : t.dataset.acc;
    renderMaterias(); return;
  }
  if(t.dataset.addbtn){ agregar(t.dataset.addbtn); return; }
  if(t.dataset.caddbtn){ agregarCtrl(t.dataset.caddbtn); return; }
  if(t.dataset.ctrl){
    const [k, j] = t.dataset.ctrl.split('|');
    ctrls(k)[+j].ok = !ctrls(k)[+j].ok; save(); renderMaterias(); return;
  }
  if(t.dataset.cdel){
    const [k, j] = t.dataset.cdel.split('|');
    ctrls(k).splice(+j, 1); save(); renderMaterias(); return;
  }

  if(t.id === 'b-exp'){ $('#codigo').value = btoa(unescape(encodeURIComponent(JSON.stringify(db)))); $('#codigo').select(); return; }
  if(t.id === 'b-imp'){
    try{
      db = Object.assign({}, DB_BASE, JSON.parse(decodeURIComponent(escape(atob($('#codigo').value.trim())))));
      normalizarRutina(); save(); pintar();
    }catch(e){ alert('Ese código no se pudo leer. Copialo entero e intentá de nuevo.'); }
    return;
  }
  if(t.id === 'b-rutina'){
    if(confirm('¿Volver a la rutina original? Se pierden los cambios que hiciste en los días. Los tildes y el temario no se tocan.')){
      db.rutina = null; normalizarRutina(); save(); pintar();
    }
    return;
  }
  if(t.id === 'b-reset'){
    if(confirm('¿Borrar los tildes y las horas de esta semana? El temario no se toca.')){
      db.semanas[SK] = {check:{}, min:{}}; save(); pintar();
    }
    return;
  }
});

function agregar(ref){
  const inp = document.querySelector('[data-add="' + ref + '"]');
  if(!inp) return;
  const v = inp.value.trim();
  if(!v) return;
  const [k, rn] = ref.split('|');
  unis(k).push({t:v, ok:false, r:+rn});
  save(); renderMaterias();
  const nuevo = document.querySelector('[data-add="' + ref + '"]');
  if(nuevo) nuevo.focus();
}

function agregarCtrl(k){
  const it = document.querySelector('[data-cadd-t="' + k + '"]');
  const iff = document.querySelector('[data-cadd-f="' + k + '"]');
  const v = it.value.trim();
  if(!v && !iff.value) return;
  ctrls(k).push({t: v || 'Control', f: iff.value, ok:false});
  ctrls(k).sort((a,b) => (a.f||'9999').localeCompare(b.f||'9999'));
  save(); renderMaterias();
  const nuevo = document.querySelector('[data-cadd-t="' + k + '"]');
  if(nuevo) nuevo.focus();
}

document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && hojaCtx){ cerrarHoja(); return; }
  if(ev.key !== 'Enter' || !ev.target.dataset) return;
  if(ev.target.dataset.add)   agregar(ev.target.dataset.add);
  if(ev.target.dataset.caddT) agregarCtrl(ev.target.dataset.caddT);
});
document.addEventListener('change', ev => {
  if(ev.target.id === 'f-mat'){
    const o = $('#f-otro'); if(o) o.classList.toggle('hidden', ev.target.value !== 'otro');
  }
  if(ev.target.id === 'f-tipo'){
    const o = $('#f-horas'); if(o) o.classList.toggle('hidden', ev.target.value === 'libre');
  }
  if(ev.target.dataset && ev.target.dataset.nt){
    const [k, id, campo] = ev.target.dataset.nt.split('|');
    const v = ev.target.value;
    cfgIt(k, id)[campo] = (v === '' ? null : +v);
    save(); renderNotas(); return;
  }
  if(ev.target.dataset && ev.target.dataset.ncfg){
    const [k, campo] = ev.target.dataset.ncfg.split('|');
    const v = ev.target.value;
    nota(k)[campo] = (v === '' ? (campo === 'cred' ? 0 : (campo === 'tope' ? 100 : 50)) : +v);
    save(); renderNotas(); return;
  }
  const ref = ev.target.dataset ? ev.target.dataset.revFecha : null;
  if(ref){
    const [k, rn] = ref.split('|');
    rev(k)[rn] = ev.target.value; save(); renderMaterias();
  }
});

/* arranque */
const tema = raw(KEY + '-tema');
if(tema === 'night'){ document.documentElement.dataset.theme = 'night'; $('#btn-tema').textContent = '☀️'; }
pintar();
pintarEstado();
if(SYNC.url){ bajar(true); setInterval(() => bajar(false), 10000); }
setInterval(() => { if(!hojaCtx) renderHoy(); }, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
